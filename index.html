<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>高中單字挑戰王 - 學生端</title>
  <style>
    :root {
      --primary: #4338ca;
      --primary-light: #6366f1;
      --success: #10b981;
      --danger: #ef4444;
      --dark: #0f172a;
      --border: #e2e8f0;
      --bg: #020617;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: var(--bg); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 12px; }
    .app-shell { width: 100%; max-width: 500px; background: #ffffff; border-radius: 28px; overflow: hidden; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.8); display: flex; flex-direction: column; min-height: 750px; }
    .student-login-view { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 30px 24px; text-align: center; flex: 1; }
    .app-nav { display: flex; background: #1e293b; padding: 8px 10px; gap: 6px; align-items: center; }
    .nav-tabs-group { display: flex; flex: 1; gap: 4px; overflow-x: auto; }
    .nav-btn { flex: 1; min-width: 75px; border: none; background: transparent; padding: 9px 4px; border-radius: 12px; font-weight: 700; font-size: 0.8rem; color: #94a3b8; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 4px; white-space: nowrap; }
    .nav-btn.active { background: #334155; color: #f8fafc; }
    .badge { background: var(--danger); color: white; font-size: 0.7rem; padding: 2px 6px; border-radius: 10px; }
    .view-panel { display: none; flex-direction: column; padding: 18px; flex: 1; }
    .view-panel.active { display: flex; }
    .chapter-selector-bar { display: flex; align-items: center; gap: 8px; background: #f8fafc; padding: 8px 12px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 12px; font-size: 0.88rem; font-weight: 700; color: #334155; }
    .chapter-dropdown { flex: 1; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--border); background: white; font-weight: 600; outline: none; }
    .game-status-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .pill { padding: 6px 12px; border-radius: 20px; font-size: 0.85rem; font-weight: 700; }
    .pill-level { background: #e0e7ff; color: var(--primary); }
    .pill-score { background: #fef3c7; color: #b45309; }
    .timer-wrapper { display: flex; align-items: center; font-weight: 800; font-size: 1.1rem; color: var(--danger); }
    .timer-progress-bar { width: 100%; height: 6px; background: #e2e8f0; border-radius: 3px; margin-bottom: 16px; overflow: hidden; }
    .timer-fill { height: 100%; background: var(--danger); width: 100%; transition: width 1s linear; }
    .card { background: white; border: 2px solid var(--border); border-radius: 18px; padding: 20px; text-align: center; margin-bottom: 16px; }
    .chapter-tag { background: #fef3c7; color: #b45309; font-size: 0.8rem; font-weight: 700; padding: 3px 8px; border-radius: 6px; }
    .pos-tag { background: #e0e7ff; color: var(--primary); font-size: 0.8rem; font-weight: 700; padding: 3px 8px; border-radius: 6px; }
    .chinese-prompt { font-size: 1.75rem; color: var(--dark); margin: 10px 0; font-weight: 800; }
    .hint-audio-bar { display: flex; align-items: center; justify-content: center; gap: 12px; margin-top: 10px; }
    .hint-text { font-size: 1.15rem; font-weight: 800; color: #334155; }
    .btn-sound-hint { display: inline-flex; align-items: center; gap: 4px; background: #eef2ff; color: var(--primary); border: 1.5px solid #c7d2fe; padding: 6px 12px; border-radius: 10px; font-size: 0.95rem; font-weight: 700; cursor: pointer; }
    .pure-dashed-zone { position: relative; width: 100%; min-height: 120px; display: flex; justify-content: center; align-items: center; background: transparent !important; border: none !important; cursor: text; padding: 10px 4px; }
    .slots-flex-row { display: flex; flex-wrap: wrap; justify-content: center; align-items: flex-end; gap: 8px; row-gap: 18px; pointer-events: none; }
    .slot-cell-unit { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; width: 34px; }
    .correction-slot-top { height: 26px; display: flex; align-items: center; justify-content: center; margin-bottom: 4px; width: 100%; }
    .correct-letter-badge { background: #10b981; color: #ffffff; font-size: 1.05rem; font-weight: 900; width: 26px; height: 24px; border-radius: 6px; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 4px rgba(16, 185, 129, 0.4); text-transform: lowercase; }
    .dash-underline { width: 100%; height: 48px; border-bottom: 4px solid #94a3b8 !important; display: flex; align-items: center; justify-content: center; font-size: 1.95rem; font-weight: 900; color: #0f172a; text-transform: lowercase; transition: all 0.15s ease; }
    .dash-underline.focusing { border-bottom: 4px solid #4f46e5 !important; background: rgba(79, 70, 229, 0.05); border-radius: 6px 6px 0 0; }
    .dash-underline.char-wrong { color: #ef4444 !important; border-bottom: 4px solid #ef4444 !important; background: rgba(239, 68, 68, 0.08); border-radius: 6px 6px 0 0; }
    .dash-underline.char-right { color: #10b981 !important; border-bottom: 4px solid #10b981 !important; background: rgba(16, 185, 129, 0.08); border-radius: 6px 6px 0 0; }
    .ghost-input { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0 !important; cursor: text; }
    .btn-primary { width: 100%; padding: 13px; background: var(--primary); color: white; border: none; border-radius: 14px; font-size: 1rem; font-weight: 800; cursor: pointer; touch-action: manipulation; }
    .btn-next-action { flex: 1; padding: 14px; background: linear-gradient(135deg, #10b981, #059669); color: white; border: none; border-radius: 14px; font-size: 1.05rem; font-weight: 800; cursor: pointer; touch-action: manipulation; }
    .feedback-box { margin-top: 14px; padding: 12px 16px; border-radius: 12px; font-weight: 700; display: none; justify-content: space-between; align-items: center; text-align:center; }
    .feedback-box.success { background: #ecfdf5; color: #065f46; display: flex; }
    .feedback-box.error { background: #fef2f2; color: #991b1b; display: flex; }
    .admin-input-full { width: 100%; padding: 10px; border: 1.5px solid var(--border); border-radius: 8px; margin-bottom: 8px; outline: none; }
    
    .arena-bg { background: radial-gradient(circle at top, #1e293b 0%, #090d16 100%) !important; color: #ffffff; justify-content: flex-start; }
    .cloze-top-control { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .chapter-select-dark { background: #1e293b; color: #f8fafc; border: 1px solid #475569; padding: 8px 10px; border-radius: 8px; font-weight: 600; outline: none; flex:1; margin-left:8px; }
    .answers-stack { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
    .choice-btn { width: 100%; padding: 15px 16px; background: linear-gradient(180deg, #ffffff 0%, #e2e8f0 100%); border: none; border-radius: 14px; font-size: 1.15rem; font-weight: 800; color: #1e293b; cursor: pointer; text-align:left; transition: all 0.2s; touch-action: manipulation; }
    .choice-btn:hover { background: #e0e7ff; }
    .choice-btn.correct { background: linear-gradient(180deg, #34d399 0%, #059669 100%) !important; color: #fff !important; }
    .choice-btn.wrong { background: linear-gradient(180deg, #f87171 0%, #dc2626 100%) !important; color: #fff !important; }
  </style>
</head>
<body>
  <div class="app-shell">
    <!-- ================= 學生登入介面 ================= -->
    <div id="view-student-login" class="student-login-view">
      <div style="font-size:3.5rem; margin-bottom:10px;">👑</div>
      <h2 style="color:#0f172a; margin-bottom:6px;">高中單字挑戰王</h2>
      <p style="color:#10b981; font-size:0.85rem; margin-bottom:20px; font-weight:700;">系統就緒 🟢 (觸控優化版)</p>
      <div style="width:100%; max-width:340px;">
        <input type="text" id="student-acc-input" placeholder="學生帳號 (例如: roger)" class="admin-input-full" style="padding:12px; font-size:1rem;" />
        <input type="password" id="student-pwd-input" placeholder="密碼 (例如: 1209)" class="admin-input-full" style="padding:12px; font-size:1rem;" />
        <button id="student-login-btn" class="btn-primary" style="margin-top:6px; padding:12px; font-size:1.1rem;" onclick="alert('按鈕有反應了！'); attemptLogin();">進入系統挑戰 ➔</button>
        <p id="student-login-err" style="color:var(--danger); font-size:0.85rem; margin-top:10px; display:none;">帳號或密碼錯誤！</p>
      </div>
    </div>

    <!-- ================= 學生大廳 ================= -->
    <div id="view-student-lobby" style="display:none; flex-direction:column; padding: 30px 24px; flex:1; align-items:center; justify-content:center;">
      <h2 style="color:#0f172a; margin-bottom:8px; font-size:1.8rem;">👋 歡迎，<span id="lobby-student-name" style="color:var(--primary);"></span></h2>
      <p id="lobby-perm-tag" style="color:#10b981; font-weight:700; font-size:0.95rem; margin-bottom: 24px;"></p>
      
      <div class="card" style="width:100%; text-align:left; padding: 24px;">
        <h3 style="color:#1e293b; margin-bottom:16px; font-size:1.1rem; text-align:center;">🎯 請選擇題庫範圍</h3>
        <label style="font-weight:800; font-size:0.95rem; color:#334155; margin-bottom:6px; display:block;">1. 單字庫大分類：</label>
        <select id="lobby-category-select" class="admin-input-full" style="font-size:1rem; padding:12px;"></select>
        <label style="font-weight:800; font-size:0.95rem; color:#334155; margin-bottom:6px; display:block; margin-top:16px;">2. 章節 / 資料夾：</label>
        <select id="lobby-folder-select" class="admin-input-full" style="font-size:1rem; padding:12px;"></select>
        <label style="font-weight:800; font-size:0.95rem; color:#334155; margin-bottom:6px; display:block; margin-top:16px;">3. 選擇訓練模式：</label>
        <select id="lobby-mode-select" class="admin-input-full" style="font-size:1rem; padding:12px;">
          <option value="view-game">👑 單字挑戰 (拼寫作答)</option>
          <option value="view-phrase">🧩 片語特訓</option>
          <option value="view-cloze">⚔️ 克漏字對戰 (依據 AI 例句)</option>
          <option value="view-mistakes">📖 不熟區</option>
        </select>
        <button id="lobby-start-btn" class="btn-primary" style="margin-top: 24px; font-size:1.1rem; padding:14px; background:#10b981;">🚀 進入訓練區</button>
      </div>
      <button id="lobby-logout-btn" class="btn-secondary" style="margin-top: 20px; width:100%; padding:12px;">登出換人</button>
    </div>

    <!-- ================= 學生主操作畫面 ================= -->
    <div id="view-student-main" style="display:none; flex-direction:column; flex:1;">
      <header class="app-nav">
        <div class="nav-tabs-group">
          <button class="nav-btn active" data-target="view-game" id="tab-game-btn">👑 單字挑戰</button>
          <button class="nav-btn" data-target="view-phrase" id="tab-phrase-btn">🧩 片語特訓</button>
          <button class="nav-btn" data-target="view-cloze" id="tab-cloze-btn">⚔️ 克漏字對戰</button>
          <button class="nav-btn" data-target="view-mistakes" id="tab-mistakes-btn">📖 不熟區 <span id="mistake-badge" class="badge">0</span></button>
        </div>
      </header>

      <div style="background:#f1f5f9; padding:6px 14px; font-size:0.8rem; font-weight:700; color:#475569; display:flex; justify-content:space-between; align-items:center;">
        <span>👤 學生：<b id="cur-student-name" style="color:#4338ca;">學生</b></span>
        <span id="cur-category-tag" style="color:#10b981; font-weight:800;">高中學測</span>
      </div>

      <!-- ================= 頁籤 1：單字挑戰王 ================= -->
      <main id="view-game" class="view-panel active">
        <div class="chapter-selector-bar">
          <button class="btn-back-lobby btn-secondary" style="padding:6px 10px; font-size:0.75rem; background:#cbd5e1; color:#334155; margin-right:8px; border-radius:8px;">🏠 回大廳</button>
          <label for="game-chapter-filter" style="margin-left:auto;">🎯 單元：</label>
          <select id="game-chapter-filter" class="chapter-dropdown"></select>
        </div>
        <div class="game-status-bar">
          <span id="game-progress-tag" class="pill pill-level">進度：0 / 0</span>
          <span id="score-display" class="pill pill-score">積分：0</span>
          <div class="timer-wrapper">
            <span>⏱️</span><span id="game-timer-count">15</span>s
          </div>
        </div>
        <div class="timer-progress-bar"><div id="game-timer-fill" class="timer-fill"></div></div>
        <div class="card quiz-card">
          <div style="display:flex; justify-content:center; gap:6px;">
            <span id="quiz-chapter" class="chapter-tag">Unit 1</span>
            <span id="quiz-pos" class="pos-tag">詞性</span>
          </div>
          <h2 id="quiz-chinese" class="chinese-prompt">題目載入中...</h2>
          <div class="hint-audio-bar">
            <span id="quiz-hint" class="hint-text">提示資訊</span>
            <button type="button" id="game-sound-btn" class="btn-sound-hint">🔊 聽發音</button>
          </div>
        </div>
        <div class="pure-dashed-zone" onclick="focusHiddenInput()">
          <div id="letter-slots-container" class="slots-flex-row"></div>
          <input type="text" id="answer-input" class="ghost-input" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" />
        </div>
        <div style="margin-top:14px; display:flex; gap:10px;">
          <button id="submit-btn" class="btn-primary" style="flex:1;">確認送出 (Enter)</button>
          <button id="next-question-btn" class="btn-next-action" style="display:none;">NEXT 下一題 ➔</button>
        </div>
        <div id="game-feedback" class="feedback-box"></div>
      </main>

      <!-- ================= 頁籤 2：🧩 片語特訓 ================= -->
      <main id="view-phrase" class="view-panel">
        <div class="chapter-selector-bar">
          <button class="btn-back-lobby btn-secondary" style="padding:6px 10px; font-size:0.75rem; background:#cbd5e1; color:#334155; margin-right:8px; border-radius:8px;">🏠 回大廳</button>
          <label for="phrase-chapter-filter" style="margin-left:auto;">🎯 單元：</label>
          <select id="phrase-chapter-filter" class="chapter-dropdown"></select>
        </div>
        <div class="game-status-bar">
          <span id="phrase-progress-tag" class="pill pill-level">進度：0 / 0</span>
          <span id="phrase-score-display" class="pill pill-score">積分：0</span>
          <div class="timer-wrapper">
            <span>⏱️</span><span id="phrase-timer-count">15</span>s
          </div>
        </div>
        <div class="timer-progress-bar"><div id="phrase-timer-fill" class="timer-fill"></div></div>
        
        <div class="card quiz-card">
          <div style="display:flex; justify-content:center; gap:6px;">
            <span id="phrase-chapter" class="chapter-tag">Unit 1</span>
            <span class="pos-tag" style="background:#fce7f3; color:#db2777;">phr.</span>
          </div>
          <h2 id="phrase-chinese" class="chinese-prompt">題目載入中...</h2>
        </div>
        
        <div id="phrase-options-container" class="answers-stack"></div>
        <button id="next-phrase-btn" class="btn-next-action" style="display:none; margin-top:10px; width:100%;">NEXT 下一題 ➔</button>
      </main>

      <!-- ================= 頁籤 3：克漏字對戰 ================= -->
      <main id="view-cloze" class="view-panel arena-bg">
        <div class="cloze-top-control">
          <button class="btn-back-lobby btn-secondary" style="padding:6px 10px; font-size:0.75rem; background:#cbd5e1; color:#334155; border-radius:8px;">🏠 回大廳</button>
          <select id="cloze-chapter-filter" class="chapter-select-dark"></select>
        </div>
        <div class="game-status-bar" style="color:white; margin-top:4px;">
          <span id="cloze-progress-tag" class="pill" style="background:rgba(255,255,255,0.2); color:white;">進度：0 / 0</span>
          <span id="cloze-score-display" class="pill" style="background:var(--danger); color:white;">積分：0</span>
          <div class="timer-wrapper" style="color:white;">
            <span>⏱️</span><span id="cloze-timer-count">15</span>s
          </div>
        </div>
        <div class="timer-progress-bar" style="background:rgba(255,255,255,0.2);">
          <div id="cloze-timer-fill" class="timer-fill" style="background:var(--success);"></div>
        </div>
        <div class="card" style="background:#1e293b; border-color:#334155; margin-bottom:20px; text-align:left;">
          <div style="margin-bottom:12px; display:flex; justify-content:space-between;">
             <span id="cloze-chapter-tag" class="chapter-tag" style="background:#334155; color:#cbd5e1;">Unit 1</span>
             <span id="cloze-pos-tag" class="pos-tag" style="background:#312e81; color:#a5b4fc;">n.</span>
          </div>
          <h2 id="cloze-sentence" style="font-size:1.35rem; line-height:1.6; color:#f8fafc; font-weight:800;">題目載入中...</h2>
          <p id="cloze-zh" style="display:none; color:#38bdf8; font-weight:700; margin-top:14px; font-size:1.05rem; line-height:1.5;"></p>
        </div>
        <div id="cloze-options-container" class="answers-stack"></div>
        <button id="next-cloze-btn" class="btn-next-action" style="display:none; margin-top:10px; width:100%;">NEXT 下一題 ➔</button>
      </main>

      <!-- ================= 頁籤 4：📖 不熟區 ================= -->
      <main id="view-mistakes" class="view-panel">
        <div class="chapter-selector-bar">
          <button class="btn-back-lobby btn-secondary" style="padding:6px 10px; font-size:0.75rem; background:#cbd5e1; color:#334155; margin-right:8px; border-radius:8px;">🏠 回大廳</button>
          <span style="font-weight:800; color:#334155; margin-left:auto;">我的錯題本</span>
          <button id="clear-mistakes-btn" class="btn-secondary" style="margin-left:auto; background:#fee2e2; color:#ef4444; font-size:0.75rem;">🗑️ 全部清空</button>
        </div>
        <div id="mistakes-list-container" style="display:flex; flex-direction:column; gap:10px; overflow-y:auto; flex:1; padding-bottom:20px;"></div>
      </main>
    </div>
  </div>

  <script>
    const DEFAULT_STUDENTS = [
      { acc: "roger", pwd: "1209", name: "羅傑", perm: "高中" },
      { acc: "student", pwd: "1234", name: "測試生", perm: "國中" }
    ];

    const DEFAULT_BASE_QUESTIONS = [
      {"id": 1, "category": "高中學測", "folder": "Unit 1", "word": "cue", "pos": "n.", "zh": "提示；線索", "sentence": "My teacher nodded at me, and that was my ___ to start speaking.", "options": ["cue", "finance", "prime", "rebel"]},
      {"id": 2, "category": "高中學測", "folder": "Unit 1", "word": "declare", "pos": "v.", "zh": "宣布；宣稱", "sentence": "The government decided to ___ the day a public holiday.", "options": ["declare", "divorce", "disappoint", "finance"]},
      {"id": 3, "category": "高中學測", "folder": "Unit 1", "word": "take off", "pos": "phr.", "zh": "起飛；脫下", "sentence": "The plane will ___ in ten minutes.", "options": ["take off", "give up", "look forward to", "turn out"]}
    ];

    let existingStudents = [];
    try { existingStudents = JSON.parse(localStorage.getItem('student_accounts')); } catch(e) {}
    if (!Array.isArray(existingStudents) || existingStudents.length === 0) {
      localStorage.setItem('student_accounts', JSON.stringify(DEFAULT_STUDENTS));
    }

    if (!localStorage.getItem('app_all_questions')) {
      localStorage.setItem('app_all_questions', JSON.stringify(DEFAULT_BASE_QUESTIONS));
    }

    async function initAutoSyncCloud() {
      try {
        const response = await fetch('questions.json?v=' + Date.now());
        if (response.ok) {
          const cloudData = await response.json();
          if (cloudData && cloudData.questions && cloudData.questions.length > 0) {
            localStorage.setItem('app_all_questions', JSON.stringify(cloudData.questions));
          }
          if (cloudData && cloudData.students && cloudData.students.length > 0) {
            localStorage.setItem('student_accounts', JSON.stringify(cloudData.students));
          }
        }
      } catch (e) {
        console.log("使用本機內嵌快取運行");
      }
    }
    initAutoSyncCloud();

    let loggedInStudent = null;
    let currentLobbyCategory = "高中學測";
    
    let activeWordList = [];
    let currentWordIndex = 0;
    let wordScore = 0;

    let activePhraseList = [];
    let currentPhraseIndex = 0;
    let phraseScore = 0;

    let mistakesArray = JSON.parse(localStorage.getItem('student_mistakes') || '[]');

    let timerInterval;
    let timeLeft = 15;
    let isTimeUp = false;

    let pronunciationTimeout = null;

    function initLobbyCategories() {
      let allQuestions = [];
      try { allQuestions = JSON.parse(localStorage.getItem('app_all_questions')) || DEFAULT_BASE_QUESTIONS; } 
      catch(e) { allQuestions = DEFAULT_BASE_QUESTIONS; }

      const allCats = [...new Set(allQuestions.map(q => q.category || "高中學測"))];
      let allowedCats = loggedInStudent && loggedInStudent.perm === '國中' ? allCats.filter(c => c === '國中') : allCats.filter(c => c !== '國中');
      if (allowedCats.length === 0) allowedCats = loggedInStudent && loggedInStudent.perm === '國中' ? ['國中'] : ['高中學測'];

      const catSelect = document.getElementById('lobby-category-select');
      if (catSelect) {
        catSelect.innerHTML = allowedCats.map(c => `<option value="${c}">${c}</option>`).join('');
        updateLobbyFolders();
      }
    }

    function updateLobbyFolders() {
      let allQuestions = [];
      try { allQuestions = JSON.parse(localStorage.getItem('app_all_questions')) || DEFAULT_BASE_QUESTIONS; } 
      catch(e) { allQuestions = DEFAULT_BASE_QUESTIONS; }

      const catSelect = document.getElementById('lobby-category-select');
      const folderSelect = document.getElementById('lobby-folder-select');
      if (!catSelect || !folderSelect) return;

      const cat = catSelect.value;
      const filtered = allQuestions.filter(q => (q.category || "高中學測") === cat);
      const folders = ["全部章節", ...new Set(filtered.map(q => q.folder || q.chapter || "Unit 1"))];
      folderSelect.innerHTML = folders.map(f => `<option value="${f}">${f}</option>`).join('');
    }

    // 觸控與點擊雙重強固登入函式
    function attemptLogin() {
      const errEl = document.getElementById('student-login-err');
      if (errEl) errEl.style.display = 'none';

      const accInput = document.getElementById('student-acc-input');
      const pwdInput = document.getElementById('student-pwd-input');
      if (!accInput || !pwdInput) return;

      const acc = accInput.value.trim().toLowerCase();
      const pwd = pwdInput.value.trim();

      if (!acc || !pwd) {
        alert("請輸入帳號與密碼！");
        return;
      }
      
      let studentAccounts = [];
      try {
        studentAccounts = JSON.parse(localStorage.getItem('student_accounts'));
      } catch(e) {}
      
      if (!Array.isArray(studentAccounts) || studentAccounts.length === 0) {
        studentAccounts = DEFAULT_STUDENTS;
      }

      const found = studentAccounts.find(s => String(s.acc || '').trim().toLowerCase() === acc && String(s.pwd || '').trim() === pwd);
      
      if (found) {
        loggedInStudent = found;
        loggedInStudent.perm = loggedInStudent.perm || "高中"; 
        
        document.getElementById('view-student-login').style.display = 'none';
        document.getElementById('view-student-lobby').style.display = 'flex';
        document.getElementById('lobby-student-name').innerText = found.name;
        document.getElementById('lobby-perm-tag').innerText = `權限範圍：${loggedInStudent.perm === '國中' ? '📚 國中專用' : '📖 高中與進階題庫'}`;

        initLobbyCategories();
      } else {
        if (errEl) {
          errEl.style.display = 'block';
          errEl.innerText = "帳號或密碼錯誤！(測試帳號: roger / 1209)";
        } else {
          alert("帳號或密碼錯誤！");
        }
      }
    }

    function initAppEvents() {
      updateMistakeBadge();

      // 為手機觸控優化登入按鈕（同時監聽 touchend 與 click，解決虛擬鍵盤吞沒點擊的問題）
      const loginBtn = document.getElementById('student-login-btn');
      if (loginBtn) {
        loginBtn.addEventListener('touchend', (e) => {
          e.preventDefault();
          attemptLogin();
        });
        loginBtn.addEventListener('click', attemptLogin);
      }

      function playWordAudio(word, playCount = 1) {
        if (!window.speechSynthesis) return;
        window.speechSynthesis.cancel(); 
        let count = 0;
        function speak() {
          if (count >= playCount) return;
          const utterance = new SpeechSynthesisUtterance(word);
          utterance.lang = 'en-US';
          utterance.rate = 0.7; 
          utterance.onend = () => {
            count++;
            if (count < playCount) {
              setTimeout(speak, 600); 
            }
          };
          window.speechSynthesis.speak(utterance);
        }
        speak();
      }

      const soundBtn = document.getElementById('game-sound-btn');
      if (soundBtn) {
        soundBtn.addEventListener('click', () => {
          if (activeWordList.length > 0) {
            playWordAudio(activeWordList[currentWordIndex].word, 1);
          }
        });
      }

      const pwdInput = document.getElementById('student-pwd-input');
      const accInput = document.getElementById('student-acc-input');
      if (pwdInput) pwdInput.addEventListener('keypress', (e) => { if(e.key === 'Enter') attemptLogin(); });
      if (accInput) accInput.addEventListener('keypress', (e) => { if(e.key === 'Enter') attemptLogin(); });

      const logoutBtn = document.getElementById('lobby-logout-btn');
      if (logoutBtn) {
        logoutBtn.addEventListener('click', () => {
          loggedInStudent = null;
          document.getElementById('view-student-lobby').style.display = 'none';
          document.getElementById('view-student-login').style.display = 'flex';
          document.getElementById('student-acc-input').value = '';
          document.getElementById('student-pwd-input').value = '';

          clearTimeout(pronunciationTimeout);
          if(window.speechSynthesis) window.speechSynthesis.cancel();
        });
      }

      const catSel = document.getElementById('lobby-category-select');
      if (catSel) catSel.addEventListener('change', updateLobbyFolders);

      const startBtn = document.getElementById('lobby-start-btn');
      if (startBtn) {
        startBtn.addEventListener('click', () => {
          currentLobbyCategory = document.getElementById('lobby-category-select').value;
          const selectedFolder = document.getElementById('lobby-folder-select').value;
          const selectedModeId = document.getElementById('lobby-mode-select').value;
          
          document.getElementById('view-student-lobby').style.display = 'none';
          document.getElementById('view-student-main').style.display = 'flex';
          document.getElementById('cur-student-name').innerText = loggedInStudent.name;
          document.getElementById('cur-category-tag').innerText = currentLobbyCategory;

          updateChapterDropdowns();
          ['game-chapter-filter', 'cloze-chapter-filter', 'phrase-chapter-filter'].forEach(id => {
            const dd = document.getElementById(id);
            if (dd && [...dd.options].some(o => o.value === selectedFolder)) dd.value = selectedFolder;
          });

          const targetTabBtn = document.querySelector(`.nav-btn[data-target="${selectedModeId}"]`);
          if (targetTabBtn) targetTabBtn.click();
        });
      }

      document.querySelectorAll('.btn-back-lobby').forEach(btn => {
        btn.addEventListener('click', () => {
          clearInterval(timerInterval);
          clearTimeout(pronunciationTimeout);
          if(window.speechSynthesis) window.speechSynthesis.cancel();

          document.getElementById('view-student-main').style.display = 'none';
          document.getElementById('view-student-lobby').style.display = 'flex';
          initLobbyCategories();
        });
      });

      document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
          document.querySelectorAll('.view-panel').forEach(p => p.classList.remove('active'));
          
          btn.classList.add('active');
          const targetId = btn.getAttribute('data-target');
          document.getElementById(targetId).classList.add('active');

          clearInterval(timerInterval); 
          clearTimeout(pronunciationTimeout);
          if(window.speechSynthesis) window.speechSynthesis.cancel();

          filterWordList();

          if (targetId === 'view-game') startNewWordSession();
          if (targetId === 'view-cloze') startNewClozeSession();
          if (targetId === 'view-phrase') startNewPhraseSession(); 
          if (targetId === 'view-mistakes') renderMistakes();      
        });
      });

      const gFilter = document.getElementById('game-chapter-filter');
      const cFilter = document.getElementById('cloze-chapter-filter');
      const pFilter = document.getElementById('phrase-chapter-filter');
      if (gFilter) gFilter.addEventListener('change', () => { filterWordList(); startNewWordSession(); });
      if (cFilter) cFilter.addEventListener('change', () => { filterWordList(); startNewClozeSession(); });
      if (pFilter) pFilter.addEventListener('change', () => { filterWordList(); startNewPhraseSession(); });

      function startTimer(mode) {
        clearInterval(timerInterval);
        timeLeft = 15;
        isTimeUp = false;
        updateTimerDisplay(mode);
        
        timerInterval = setInterval(() => {
          timeLeft--;
          updateTimerDisplay(mode);
          if (timeLeft <= 0) {
            clearInterval(timerInterval);
            isTimeUp = true;
            if (mode === 'game') submitWordAnswer();
            if (mode === 'cloze') handleClozeTimeout();
            if (mode === 'phrase') handlePhraseTimeout(); 
          }
        }, 1000);
      }

      function updateTimerDisplay(mode) {
        let countEl, fillEl;
        if (mode === 'game') {
          countEl = document.getElementById('game-timer-count');
          fillEl = document.getElementById('game-timer-fill');
        } else if (mode === 'cloze') {
          countEl = document.getElementById('cloze-timer-count');
          fillEl = document.getElementById('cloze-timer-fill');
        } else if (mode === 'phrase') {
          countEl = document.getElementById('phrase-timer-count');
          fillEl = document.getElementById('phrase-timer-fill');
        }
        if (countEl) countEl.innerText = timeLeft;
        if (fillEl) fillEl.style.width = (timeLeft / 15 * 100) + '%';
      }

      function updateMistakeBadge() {
        const badge = document.getElementById('mistake-badge');
        if (badge) badge.innerText = mistakesArray.length;
      }

      function addMistake(q) {
        if (!q) return;
        if (!mistakesArray.some(m => m.word === q.word)) {
          mistakesArray.push(q);
          localStorage.setItem('student_mistakes', JSON.stringify(mistakesArray));
          updateMistakeBadge();
        }
      }

      const nextQBtn = document.getElementById('next-question-btn');
      const subBtn = document.getElementById('submit-btn');
      const ansInp = document.getElementById('answer-input');

      if (nextQBtn) nextQBtn.addEventListener('click', () => { currentWordIndex++; loadWordQuestion(); });
      if (subBtn) subBtn.addEventListener('click', submitWordAnswer);
      if (ansInp) {
        ansInp.addEventListener('input', updateSlotsDisplay);
        ansInp.addEventListener('keypress', (e) => {
          if (e.key === 'Enter') {
            if (document.getElementById('submit-btn').style.display !== 'none') submitWordAnswer();
            else document.getElementById('next-question-btn').click();
          }
        });
      }

      function startNewWordSession() {
        currentWordIndex = 0; wordScore = 0;
        const scoreDisp = document.getElementById('score-display');
        if (scoreDisp) scoreDisp.innerText = `積分：0`;
        loadWordQuestion();
      }

      function loadWordQuestion() {
        if (!activeWordList.length) {
          const qChin = document.getElementById('quiz-chinese');
          if (qChin) qChin.innerText = "此單元無單字";
          const slotsContainer = document.getElementById('letter-slots-container');
          if (slotsContainer) slotsContainer.innerHTML = '';
          clearInterval(timerInterval);
          return;
        }
        if (currentWordIndex >= activeWordList.length) currentWordIndex = 0;

        const q = activeWordList[currentWordIndex];
        const gProg = document.getElementById('game-progress-tag');
        const qChap = document.getElementById('quiz-chapter');
        const qPos = document.getElementById('quiz-pos');
        const qChin = document.getElementById('quiz-chinese');
        const qHint = document.getElementById('quiz-hint');

        if (gProg) gProg.innerText = `進度：${currentWordIndex + 1} / ${activeWordList.length}`;
        if (qChap) qChap.innerText = q.folder || q.chapter || "Unit 1";
        if (qPos) qPos.innerText = q.pos;
        if (qChin) qChin.innerText = q.zh;
        if (qHint) qHint.innerText = `長度：${q.word.length} 字母・首字 [ ${q.word[0]} ]`;

        const input = document.getElementById('answer-input');
        if (input) {
          input.value = '';
          input.disabled = false;
          input.maxLength = q.word.length;
          input.focus();
        }

        updateSlotsDisplay();
        const fb = document.getElementById('game-feedback');
        if (fb) fb.style.display = 'none';
        if (subBtn) subBtn.style.display = 'block';
        if (nextQBtn) nextQBtn.style.display = 'none';

        startTimer('game');

        clearTimeout(pronunciationTimeout);
        if(window.speechSynthesis) window.speechSynthesis.cancel();
        pronunciationTimeout = setTimeout(() => {
          const currentView = document.querySelector('.view-panel.active');
          if (currentView && currentView.id === 'view-game' && input && !input.disabled) {
            playWordAudio(q.word, 2);
          }
        }, 2000);
      }

      function updateSlotsDisplay() {
        const input = document.getElementById('answer-input');
        if (!input) return;
        const val = input.value;
        const q = activeWordList[currentWordIndex];
        if (!q || !q.word) return;

        const targetWord = q.word;
        const container = document.getElementById('letter-slots-container');
        if (!container) return;
        container.innerHTML = '';

        for (let i = 0; i < targetWord.length; i++) {
          const unit = document.createElement('div'); unit.className = 'slot-cell-unit';
          const top = document.createElement('div'); top.className = 'correction-slot-top';
          const dash = document.createElement('div'); dash.className = 'dash-underline';

          if (i < val.length) dash.innerText = val[i];
          if (i === val.length && !input.disabled) dash.classList.add('focusing');

          if (input.disabled) {
            if (val[i] && val[i].toLowerCase() === targetWord[i].toLowerCase()) {
              dash.classList.add('char-right');
            } else {
              dash.classList.add('char-wrong');
              top.innerHTML = `<div class="correct-letter-badge">${targetWord[i]}</div>`;
            }
          }
          unit.appendChild(top); unit.appendChild(dash); container.appendChild(unit);
        }
      }

      function submitWordAnswer() {
        if (!activeWordList.length) return;
        clearInterval(timerInterval); 
        
        clearTimeout(pronunciationTimeout);
        if(window.speechSynthesis) window.speechSynthesis.cancel();

        const input = document.getElementById('answer-input');
        if (!input) return;
        const userAns = input.value.trim().toLowerCase();
        const target = activeWordList[currentWordIndex].word.trim().toLowerCase();
        const fb = document.getElementById('game-feedback');
        const q = activeWordList[currentWordIndex]; 

        input.disabled = true;

        if (userAns === target && !isTimeUp) {
          wordScore += 100;
          const scoreDisp = document.getElementById('score-display');
          if (scoreDisp) scoreDisp.innerText = `積分：${wordScore}`;
          if (fb) {
            fb.className = 'feedback-box success';
            fb.innerHTML = `🎉 完全正確！`;
          }
        } else {
          if (fb) {
            fb.className = 'feedback-box error';
            fb.innerHTML = isTimeUp ? `⏰ 時間到！正解：${target}` : `❌ 錯誤！正解：${target}`;
          }
          addMistake(q); 
        }

        updateSlotsDisplay();
        if (subBtn) subBtn.style.display = 'none';
        if (nextQBtn) nextQBtn.style.display = 'block';
      }

      window.focusHiddenInput = function() {
        const inp = document.getElementById('answer-input');
        if (inp && !inp.disabled) { inp.focus(); updateSlotsDisplay(); }
      };

      const nextPhraseBtn = document.getElementById('next-phrase-btn');
      if (nextPhraseBtn) nextPhraseBtn.addEventListener('click', () => { currentPhraseIndex++; loadPhraseQuestion(); });

      function startNewPhraseSession() {
        currentPhraseIndex = 0; phraseScore = 0;
        const pScoreDisp = document.getElementById('phrase-score-display');
        if (pScoreDisp) pScoreDisp.innerText = `積分：0`;
        loadPhraseQuestion();
      }

      function loadPhraseQuestion() {
        if (!activePhraseList.length) {
          const pChin = document.getElementById('phrase-chinese');
          if (pChin) pChin.innerText = "此單元無片語題目";
          const pOptsContainer = document.getElementById('phrase-options-container');
          if (pOptsContainer) pOptsContainer.innerHTML = '';
          clearInterval(timerInterval);
          return;
        }
        if (currentPhraseIndex >= activePhraseList.length) currentPhraseIndex = 0;

        const q = activePhraseList[currentPhraseIndex];
        const pProg = document.getElementById('phrase-progress-tag');
        const pChap = document.getElementById('phrase-chapter');
        const pChin = document.getElementById('phrase-chinese');

        if (pProg) pProg.innerText = `進度：${currentPhraseIndex + 1} / ${activePhraseList.length}`;
        if (pChap) pChap.innerText = q.folder || q.chapter || "Unit 1";
        if (pChin) pChin.innerText = q.zh;

        const box = document.getElementById('phrase-options-container');
        if (!box) return;
        box.innerHTML = '';
        
        let opts = q.options && q.options.length >= 4 ? [...q.options] : [q.word, "take off", "look forward to", "give up"];
        if (!opts.includes(q.word)) opts[0] = q.word; 
        opts = opts.sort(() => 0.5 - Math.random()); 

        opts.forEach(opt => {
          const btn = document.createElement('button');
          btn.className = 'choice-btn';
          btn.innerText = opt;
          btn.onclick = () => handlePhraseClick(opt, q.word, btn, box, q);
          box.appendChild(btn);
        });

        if (nextPhraseBtn) nextPhraseBtn.style.display = 'none';
        startTimer('phrase');
      }

      function handlePhraseClick(selected, correctWord, clickedBtn, box, q) {
        clearInterval(timerInterval);
        const allBtns = box.querySelectorAll('button');
        allBtns.forEach(b => b.disabled = true);

        if (selected === correctWord) {
          clickedBtn.classList.add('correct');
          phraseScore += 100;
          const pScoreDisp = document.getElementById('phrase-score-display');
          if (pScoreDisp) pScoreDisp.innerText = `積分：${phraseScore}`;
        } else {
          clickedBtn.classList.add('wrong');
          allBtns.forEach(b => { if (b.innerText === correctWord) b.classList.add('correct'); });
          addMistake(q); 
        }
        if (nextPhraseBtn) nextPhraseBtn.style.display = 'block';
      }

      function handlePhraseTimeout() {
        const box = document.getElementById('phrase-options-container');
        if (!box) return;
        const allBtns = box.querySelectorAll('button');
        allBtns.forEach(b => b.disabled = true);
        const q = activePhraseList[currentPhraseIndex];
        
        allBtns.forEach(b => { if (b.innerText === q.word) b.classList.add('correct'); });
        addMistake(q); 
        if (nextPhraseBtn) nextPhraseBtn.style.display = 'block';
      }

      // 克漏字對戰
      const nextClozeBtn = document.getElementById('next-cloze-btn');
      if (nextClozeBtn) nextClozeBtn.addEventListener('click', () => { currentWordIndex++; loadClozeQuestion(); });

      function startNewClozeSession() {
        currentWordIndex = 0; wordScore = 0;
        const cScoreDisp = document.getElementById('cloze-score-display');
        if (cScoreDisp) cScoreDisp.innerText = `積分：0`;
        loadClozeQuestion();
      }

      function loadClozeQuestion() {
        if (!activeWordList.length) {
          const cSent = document.getElementById('cloze-sentence');
          if (cSent) cSent.innerText = "此單元無克漏字題目";
          const cZh = document.getElementById('cloze-zh');
          if (cZh) { cZh.innerText = ""; cZh.style.display = "none"; }
          const cOptsContainer = document.getElementById('cloze-options-container');
          if (cOptsContainer) cOptsContainer.innerHTML = '';
          clearInterval(timerInterval);
          return;
        }
        if (currentWordIndex >= activeWordList.length) currentWordIndex = 0;

        const q = activeWordList[currentWordIndex];
        const cProg = document.getElementById('cloze-progress-tag');
        const cChap = document.getElementById('cloze-chapter-tag');
        const cPos = document.getElementById('cloze-pos-tag');
        const cSent = document.getElementById('cloze-sentence');
        const cZh = document.getElementById('cloze-zh');

        if (cProg) cProg.innerText = `進度：${currentWordIndex + 1} / ${activeWordList.length}`;
        if (cChap) cChap.innerText = q.folder || q.chapter || "Unit 1";
        if (cPos) cPos.innerText = q.pos;

        let sentenceText = q.sentence || `The meaning of this word is ___ .`;
        if (cSent) cSent.innerHTML = sentenceText.replace('___', '<span style="color:var(--danger);">___</span>');
        
        if (cZh) { cZh.innerHTML = ""; cZh.style.display = "none"; }

        const box = document.getElementById('cloze-options-container');
        if (!box) return;
        box.innerHTML = '';
        let opts = q.options && q.options.length >= 4 ? [...q.options] : [q.word, "option A", "option B", "option C"];
        if (!opts.includes(q.word)) opts[0] = q.word; 
        opts = opts.sort(() => 0.5 - Math.random()); 

        opts.forEach(opt => {
          const btn = document.createElement('button');
          btn.className = 'choice-btn';
          btn.innerText = opt;
          btn.onclick = () => handleClozeClick(opt, q.word, btn, box, q);
          box.appendChild(btn);
        });

        if (nextClozeBtn) nextClozeBtn.style.display = 'none';
        startTimer('cloze');
      }

      async function renderSentenceTranslation(q) {
        const zhEl = document.getElementById('cloze-zh');
        if (!zhEl) return;
        zhEl.style.display = 'block';

        if (q.sentence_zh) {
          zhEl.innerText = `中文翻譯：${q.sentence_zh}`;
          return;
        }

        const fullSentence = (q.sentence || '').replace(/___/g, q.word);
        zhEl.innerText = '中文翻譯：翻譯載入中...';

        try {
          const res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=zh-TW&dt=t&q=${encodeURIComponent(fullSentence)}`);
          const data = await res.json();
          if (data && data[0]) {
            const translated = data[0].map(item => item[0]).join('');
            zhEl.innerText = `中文翻譯：${translated}`;
          } else {
            zhEl.innerText = `中文翻譯：(無法取得翻譯)`;
          }
        } catch (e) {
          zhEl.innerText = `中文翻譯：(無法取得翻譯)`;
        }
      }

      function handleClozeClick(selected, correctWord, clickedBtn, box, q) {
        clearInterval(timerInterval);
        const allBtns = box.querySelectorAll('button');
        allBtns.forEach(b => b.disabled = true);

        if (selected === correctWord) {
          clickedBtn.classList.add('correct');
          wordScore += 100;
          const cScoreDisp = document.getElementById('cloze-score-display');
          if (cScoreDisp) cScoreDisp.innerText = `積分：${wordScore}`;
        } else {
          clickedBtn.classList.add('wrong');
          allBtns.forEach(b => { if (b.innerText === correctWord) b.classList.add('correct'); });
          addMistake(q); 
        }

        renderSentenceTranslation(q);
        if (nextClozeBtn) nextClozeBtn.style.display = 'block';
      }

      function handleClozeTimeout() {
        const box = document.getElementById('cloze-options-container');
        if (!box) return;
        const allBtns = box.querySelectorAll('button');
        allBtns.forEach(b => b.disabled = true);
        const q = activeWordList[currentWordIndex];
        
        allBtns.forEach(b => { if (b.innerText === q.word) b.classList.add('correct'); });
        addMistake(q); 

        renderSentenceTranslation(q);
        if (nextClozeBtn) nextClozeBtn.style.display = 'block';
      }

      // 不熟區
      const clearMistakesBtn = document.getElementById('clear-mistakes-btn');
      if (clearMistakesBtn) {
        clearMistakesBtn.addEventListener('click', () => {
          if(confirm('確定要清空所有不熟的單字嗎？')) {
            mistakesArray = [];
            localStorage.setItem('student_mistakes', JSON.stringify(mistakesArray));
            updateMistakeBadge();
            renderMistakes();
          }
        });
      }

      function renderMistakes() {
        const container = document.getElementById('mistakes-list-container');
        if (!container) return;
        container.innerHTML = '';
        if (mistakesArray.length === 0) {
          container.innerHTML = `<div style="text-align:center; color:#64748b; padding:20px; font-weight:700;">太棒了！目前沒有不熟的單字 🎉</div>`;
          return;
        }

        mistakesArray.forEach((q, index) => {
          const card = document.createElement('div');
          card.className = 'card';
          card.style.textAlign = 'left';
          card.style.padding = '16px';
          card.style.marginBottom = '10px';
          card.innerHTML = `
            <div style="display:flex; justify-content:space-between; align-items:flex-start;">
              <div>
                <span class="chapter-tag">${q.folder || q.chapter || 'Unit'}</span>
                <span class="pos-tag">${q.pos || '詞性'}</span>
                <h3 style="color:var(--primary); margin:8px 0 4px 0; font-size:1.3rem;">${q.word}</h3>
                <p style="color:#475569; font-weight:700;">${q.zh}</p>
                <p style="color:#64748b; font-size:0.85rem; margin-top:6px;">${q.sentence || ''}</p>
              </div>
              <button class="btn-del" onclick="removeMistake(${index})" style="padding:6px 10px; font-size:0.8rem; background:#fee2e2; color:#ef4444; border:none; border-radius:6px; cursor:pointer; font-weight:800;">移除</button>
            </div>
          `;
          container.appendChild(card);
        });
      }

      window.removeMistake = function(index) {
        mistakesArray.splice(index, 1);
        localStorage.setItem('student_mistakes', JSON.stringify(mistakesArray));
        updateMistakeBadge();
        renderMistakes();
      };

      function updateChapterDropdowns() {
        let allQuestions = [];
        try { allQuestions = JSON.parse(localStorage.getItem('app_all_questions')) || DEFAULT_BASE_QUESTIONS; } 
        catch(e) { allQuestions = DEFAULT_BASE_QUESTIONS; }
        
        const filtered = allQuestions.filter(q => (q.category || "高中學測") === currentLobbyCategory);
        const chapters = ["全部章節", ...new Set(filtered.map(q => q.folder || q.chapter || "Unit 1"))];
        
        ['game-chapter-filter', 'cloze-chapter-filter', 'phrase-chapter-filter'].forEach(id => {
          const sel = document.getElementById(id);
          if (sel) {
            const cur = sel.value;
            sel.innerHTML = chapters.map(c => `<option value="${c}">${c}</option>`).join('');
            if (chapters.includes(cur)) sel.value = cur;
          }
        });
      }

      function filterWordList() {
        let allQuestions = [];
        try { allQuestions = JSON.parse(localStorage.getItem('app_all_questions')) || DEFAULT_BASE_QUESTIONS; } 
        catch(e) { allQuestions = DEFAULT_BASE_QUESTIONS; }

        const activePanel = document.querySelector('.view-panel.active');
        const viewId = activePanel ? activePanel.id : 'view-game';
        
        if (viewId === 'view-phrase') {
           const f = document.getElementById('phrase-chapter-filter')?.value || "全部章節";
           const base = allQuestions.filter(q => (q.isPhrase || q.word.trim().includes(' ') || q.word.includes('-')) && (q.category || "高中學測") === currentLobbyCategory);
           activePhraseList = f === "全部章節" ? [...base] : base.filter(q => (q.folder || q.chapter || "Unit 1") === f);
        } else {
           const filterId = viewId === 'view-game' ? 'game-chapter-filter' : 'cloze-chapter-filter';
           const f = document.getElementById(filterId)?.value || "全部章節";
           const base = allQuestions.filter(q => !q.isPhrase && !q.word.trim().includes(' ') && (q.category || "高中學測") === currentLobbyCategory);
           activeWordList = f === "全部章節" ? [...base] : base.filter(q => (q.folder || q.chapter || "Unit 1") === f);
        }
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initAppEvents);
    } else {
      initAppEvents();
    }
  </script>
</body>
</html>
