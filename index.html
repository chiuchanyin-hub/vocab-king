<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>單字挑戰王 - 學生專區</title>
  <style>
    :root {
      --primary: #4338ca;
      --success: #10b981;
      --danger: #ef4444;
      --border: #cbd5e1;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #0f172a; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 12px; }
    .app-shell { width: 100%; max-width: 500px; background: #ffffff; border-radius: 28px; overflow: hidden; box-shadow: 0 25px 50px rgba(0,0,0,0.5); display: flex; flex-direction: column; min-height: 700px; }
    .login-view, .lobby-view, .game-view { display: flex; flex-direction: column; padding: 24px; flex: 1; }
    .btn-primary { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 12px; font-weight: 800; cursor: pointer; font-size: 1rem; margin-top: 10px; }
    .btn-secondary { background: #e2e8f0; color: #334155; border: none; padding: 8px 14px; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 0.85rem; }
    .form-control { width: 100%; padding: 12px; border: 1.5px solid var(--border); border-radius: 10px; outline: none; margin-bottom: 12px; font-size: 1rem; }
    .title { font-size: 1.5rem; color: #1e293b; margin-bottom: 16px; text-align: center; font-weight: 800; }
    .option-btn { display: block; width: 100%; padding: 14px; margin-bottom: 10px; background: #f8fafc; border: 2px solid var(--border); border-radius: 12px; font-size: 1.05rem; font-weight: 700; text-align: left; cursor: pointer; transition: all 0.2s; }
    .option-btn:hover { background: #e0e7ff; border-color: var(--primary); }
    .option-btn.correct { background: #d1fae5 !important; border-color: var(--success) !important; color: #065f46; }
    .option-btn.wrong { background: #fee2e2 !important; border-color: var(--danger) !important; color: #991b1b; }
    .tag { display: inline-block; background: #e0e7ff; color: var(--primary); padding: 4px 10px; border-radius: 6px; font-size: 0.8rem; font-weight: 700; margin-bottom: 8px; }
    .card { background: #f8fafc; border: 2px solid var(--border); border-radius: 16px; padding: 20px; text-align: center; margin-bottom: 16px; }
  </style>
</head>
<body>
  <div class="app-shell">
    <!-- 1. 學生登入介面 -->
    <div id="view-login" class="login-view" style="justify-content:center; text-align:center;">
      <div style="font-size:3.5rem; margin-bottom:10px;">👑</div>
      <h2 class="title" style="margin-bottom:6px;">單字挑戰王</h2>
      <p style="color:#10b981; font-size:0.85rem; margin-bottom:20px; font-weight:700;">後台題庫動態同步 🟢</p>
      
      <div style="max-width:320px; margin:0 auto; width:100%;">
        <input type="text" id="login-acc" placeholder="學生帳號 (例如: Roger)" class="form-control" />
        <input type="password" id="login-pwd" placeholder="密碼 (例如: 1209)" class="form-control" />
        <button onclick="handleLogin()" class="btn-primary">進入系統挑戰 ➔</button>
        <p id="login-err" style="color:var(--danger); font-size:0.85rem; margin-top:10px; display:none;">帳號或密碼錯誤！</p>
      </div>
    </div>

    <!-- 2. 學生大廳介面（登入後第一頁：選擇大分類、資料夾、模式） -->
    <div id="view-lobby" class="lobby-view" style="display:none;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
        <div>
          <h2 style="font-size:1.2rem; color:#0f172a;">👋 歡迎，<span id="lobby-name" style="color:var(--primary);"></span></h2>
          <p id="lobby-perm" style="font-size:0.75rem; color:#64748b; font-weight:700;"></p>
        </div>
        <button onclick="handleLogout()" class="btn-secondary">登出</button>
      </div>

      <div style="background:#f8fafc; border:1.5px solid var(--border); border-radius:16px; padding:18px; flex:1;">
        <h3 style="font-size:1rem; color:#1e293b; margin-bottom:12px;">🎯 選擇您的挑戰範圍與模式</h3>
        
        <label style="font-size:0.85rem; font-weight:700; color:#475569; display:block; margin-bottom:4px;">1. 選擇大分類：</label>
        <select id="lobby-cat" class="form-control" onchange="updateFolders()"></select>

        <label style="font-size:0.85rem; font-weight:700; color:#475569; display:block; margin-bottom:4px;">2. 選擇子分類 / 資料夾：</label>
        <select id="lobby-folder" class="form-control"></select>

        <label style="font-size:0.85rem; font-weight:700; color:#475569; display:block; margin-bottom:4px;">3. 選擇訓練模式：</label>
        <select id="lobby-mode" class="form-control">
          <option value="quiz">🎯 四選一單字選擇題特訓</option>
          <option value="flashcard">🃏 單字卡快速複習模式</option>
        </select>

        <button onclick="startChallenge()" class="btn-primary" style="background:var(--success); margin-top:10px;">🚀 開始挑戰！</button>
      </div>
    </div>

    <!-- 3. 遊戲實戰畫面 -->
    <div id="view-game" class="game-view" style="display:none;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; background:#1e293b; padding:10px 14px; border-radius:12px; color:white;">
        <button onclick="returnToLobby()" class="btn-secondary" style="background:#334155; color:white;">🏠 回大廳</button>
        <span id="game-scope-info" style="font-size:0.8rem; font-weight:700; color:#34d399;"></span>
      </div>

      <div style="display:flex; justify-content:space-between; align-items:center; margin:14px 0; font-weight:800;">
        <span id="game-progress" style="color:#64748b;">進度: 1 / 10</span>
        <span id="game-score" style="color:#b45309; background:#fef3c7; padding:4px 10px; border-radius:10px;">積分: 0</span>
      </div>

      <div id="game-card-area" style="flex:1;"></div>
    </div>
  </div>

  <script>
    let currentUser = null;
    let allQuestions = [];
    let currentQuizList = [];
    let currentIndex = 0;
    let score = 0;

    function loadDB() {
      const saved = localStorage.getItem('app_all_questions');
      if (saved) {
        try { allQuestions = JSON.parse(saved); } catch(e) { allQuestions = []; }
      } else {
        allQuestions = [
          { id: 1, category: "高中學測", folder: "Unit 1", word: "cue", pos: "n.", zh: "提示；線索", options: ["cue", "finance", "prime", "rebel"] },
          { id: 2, category: "Level 4", folder: "Unit 2", word: "approach", pos: "n./v.", zh: "接近；方法", options: ["approach", "divorce", "disappoint", "finance"] }
        ];
      }
    }

    function handleLogin() {
      const acc = document.getElementById('login-acc').value.trim().toLowerCase();
      const pwd = document.getElementById('login-pwd').value.trim();
      const students = JSON.parse(localStorage.getItem('student_accounts') || '[{"acc":"Roger","pwd":"1209","name":"羅傑","perm":"高中"}]');

      const found = students.find(s => s.acc.toLowerCase() === acc && s.pwd === pwd);
      if (found) {
        currentUser = found;
        currentUser.perm = currentUser.perm || "高中";
        
        document.getElementById('view-login').style.display = 'none';
        document.getElementById('view-lobby').style.display = 'flex';
        document.getElementById('lobby-name').innerText = found.name;
        document.getElementById('lobby-perm').innerText = `權限範圍：${currentUser.perm === '國中' ? '📚 國中專用' : '📖 高中權限 (高中+Level 4)'}`;
        document.getElementById('login-err').style.display = 'none';

        initLobbyCats();
      } else {
        const err = document.getElementById('login-err');
        err.style.display = 'block';
        err.innerText = "帳號或密碼錯誤！";
      }
    }

    function handleLogout() {
      currentUser = null;
      document.getElementById('view-lobby').style.display = 'none';
      document.getElementById('view-login').style.display = 'flex';
      document.getElementById('login-acc').value = '';
      document.getElementById('login-pwd').value = '';
    }

    function returnToLobby() {
      document.getElementById('view-game').style.display = 'none';
      document.getElementById('view-lobby').style.display = 'flex';
      initLobbyCats();
    }

    function initLobbyCats() {
      loadDB();
      const allCats = [...new Set(allQuestions.map(q => q.category || "高中學測"))];
      let allowed = [];

      if (currentUser.perm === '國中') {
        allowed = allCats.filter(c => c === '國中');
        if (allowed.length === 0) allowed = ['國中'];
      } else {
        allowed = allCats.filter(c => c !== '國中');
        if (allowed.length === 0) allowed = ['高中學測', 'Level 4'];
      }

      const catSel = document.getElementById('lobby-cat');
      catSel.innerHTML = allowed.map(c => `<option value="${c}">${c}</option>`).join('');
      updateFolders();
    }

    function updateFolders() {
      loadDB();
      const cat = document.getElementById('lobby-cat').value;
      const folderSel = document.getElementById('lobby-folder');

      const filtered = allQuestions.filter(q => (q.category || "高中學測") === cat);
      const folders = [...new Set(filtered.map(q => q.folder || q.chapter || "Unit 1"))];

      folderSel.innerHTML = `<option value="全部資料夾">📂 全部資料夾 (${filtered.length} 題)</option>` +
        folders.map(f => `<option value="${f}">${f}</option>`).join('');
    }

    function startChallenge() {
      loadDB();
      const cat = document.getElementById('lobby-cat').value;
      const folder = document.getElementById('lobby-folder').value;
      const mode = document.getElementById('lobby-mode').value;

      if (currentUser.perm === '國中' && cat !== '國中') {
        return alert("您目前為國中權限，無法存取高中題庫！");
      }

      let list = allQuestions.filter(q => (q.category || "高中學測") === cat);
      if (folder && folder !== "全部資料夾") {
        list = list.filter(q => (q.folder || q.chapter || "Unit 1") === folder);
      }

      if (list.length === 0) {
        return alert("此分類與資料夾中尚無題目，請至後台新增或匯入！");
      }

      currentQuizList = [...list].sort(() => 0.5 - Math.random());
      currentIndex = 0;
      score = 0;

      document.getElementById('view-lobby').style.display = 'none';
      document.getElementById('view-game').style.display = 'flex';
      document.getElementById('game-scope-info').innerText = `${cat} / ${folder}`;

      if (mode === 'quiz') {
        renderQuiz();
      } else {
        renderFlashcard();
      }
    }

    function renderQuiz() {
      if (currentIndex >= currentQuizList.length) {
        document.getElementById('game-card-area').innerHTML = `
          <div class="card" style="padding:40px 20px;">
            <div style="font-size:3rem; margin-bottom:10px;">🎉</div>
            <h3 style="color:#1e293b; margin-bottom:8px;">恭喜完成本次挑戰！</h3>
            <p style="color:#64748b; margin-bottom:20px;">總得分：${score} / ${currentQuizList.length} 題</p>
            <button onclick="startChallenge()" class="btn-primary" style="margin-bottom:10px;">再挑戰一次</button>
            <button onclick="returnToLobby()" class="btn-secondary" style="width:100%;">返回大廳選擇其他單元</button>
          </div>
        `;
        document.getElementById('game-progress').innerText = `完成！`;
        return;
      }

      const q = currentQuizList[currentIndex];
      document.getElementById('game-progress').innerText = `進度: ${currentIndex + 1} / ${currentQuizList.length}`;
      document.getElementById('game-score').innerText = `積分: ${score}`;

      const area = document.getElementById('game-card-area');
      area.innerHTML = `
        <div class="card">
          <span class="tag">${q.category} / ${q.folder || q.chapter}</span>
          <span class="tag" style="background:#fef3c7; color:#b45309;">${q.pos || '詞性'}</span>
          <h2 class="title" style="font-size:1.6rem; margin:12px 0;">${q.zh}</h2>
        </div>
        <div id="options-box"></div>
      `;

      const box = document.getElementById('options-box');
      let opts = q.options;
      if (!opts || opts.length < 4) {
        opts = [q.word, "option_a", "option_b", "option_c"];
      }
      // 確保選項包含正確答案並隨機打亂
      if (!opts.includes(q.word)) opts[0] = q.word;
      opts = [...opts].sort(() => 0.5 - Math.random());

      opts.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerText = opt;
        btn.onclick = () => {
          const allBtns = box.querySelectorAll('button');
          allBtns.forEach(b => b.disabled = true);

          if (opt === q.word) {
            btn.classList.add('correct');
            score += 100;
          } else {
            btn.classList.add('wrong');
            allBtns.forEach(b => {
              if (b.innerText === q.word) b.classList.add('correct');
            });
          }

          setTimeout(() => {
            currentIndex++;
            renderQuiz();
          }, 1100);
        };
        box.appendChild(btn);
      });
    }

    function renderFlashcard() {
      if (currentIndex >= currentQuizList.length) currentIndex = 0;
      const q = currentQuizList[currentIndex];
      document.getElementById('game-progress').innerText = `單字卡複習: ${currentIndex + 1} / ${currentQuizList.length}`;
      document.getElementById('game-score').innerText = `單字卡模式`;

      const area = document.getElementById('game-card-area');
      area.innerHTML = `
        <div class="card" style="padding:36px 20px;">
          <span class="tag">${q.category} / ${q.folder || q.chapter}</span>
          <h1 style="font-size:2.2rem; color:var(--primary); margin:16px 0;">${q.word}</h1>
          <p style="color:#64748b; font-weight:700; margin-bottom:12px;">[${q.pos || 'n.'}]</p>
          <h3 style="font-size:1.4rem; color:#1e293b;">${q.zh}</h3>
        </div>
        <div style="display:flex; gap:10px;">
          <button onclick="currentIndex++; renderFlashcard();" class="btn-primary">下一個單字 ➔</button>
          <button onclick="returnToLobby()" class="btn-secondary">回大廳</button>
        </div>
      `;
    }
  </script>
</body>
</html>
