<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>單字挑戰王 - 完整功能管理控制台</title>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    :root {
      --primary: #4338ca;
      --success: #10b981;
      --danger: #ef4444;
      --border: #cbd5e1;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #0f172a; min-height: 100vh; padding: 24px 12px; display: flex; justify-content: center; }
    .admin-container { width: 100%; max-width: 950px; background: #f8fafc; border-radius: 24px; padding: 24px; box-shadow: 0 20px 40px rgba(0,0,0,0.5); }
    .nav-bar { display: flex; justify-content: space-between; align-items: center; background: #1e293b; color: white; padding: 14px 20px; border-radius: 16px; margin-bottom: 20px; }
    .section-card { background: white; border: 1.5px solid var(--border); border-radius: 16px; padding: 18px; margin-bottom: 18px; }
    .section-card h3 { font-size: 1.05rem; color: #1e293b; margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
    .btn-primary { background: var(--primary); color: white; border: none; padding: 10px 16px; border-radius: 8px; font-weight: 800; cursor: pointer; }
    .btn-excel { background: #10b981; color: white; border: none; padding: 10px 18px; border-radius: 8px; font-weight: 800; cursor: pointer; }
    .btn-secondary { background: #e2e8f0; color: #334155; border: none; padding: 10px 16px; border-radius: 8px; font-weight: 700; cursor: pointer; }
    .btn-ai { background: linear-gradient(135deg, #6366f1, #a855f7); color: white; border: none; padding: 10px 18px; border-radius: 8px; font-weight: 800; cursor: pointer; }
    .form-row { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
    .form-control { width: 100%; padding: 10px; border: 1.5px solid var(--border); border-radius: 8px; outline: none; margin-bottom: 8px; font-size: 0.9rem; }
    .item-card { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 8px; background: #ffffff; }
    .btn-del { border: none; background: #fee2e2; color: #ef4444; border-radius: 6px; padding: 6px 12px; font-weight: 800; cursor: pointer; }
    .tag-category { background: #dbeafe; color: #1e40af; padding: 3px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: 700; }
    .tag-folder { background: #fef3c7; color: #b45309; padding: 3px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: 700; }
    .tag-perm { background: #e0e7ff; color: #3730a3; padding: 3px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: 700; }
  </style>
</head>
<body>
  <div class="admin-container">
    <!-- 登入驗證遮罩 -->
    <div id="auth-panel" style="text-align:center; padding:50px 20px;">
      <div style="font-size:3.5rem; margin-bottom:10px;">🔐</div>
      <h2 style="color:#0f172a; margin-bottom:8px;">後台管理平台驗證</h2>
      <p style="color:#64748b; font-size:0.85rem; margin-bottom:20px;">請輸入管理員密碼 (預設: <b style="color:#4338ca;">admin888</b>)</p>
      <div style="max-width:320px; margin:0 auto;">
        <input type="password" id="admin-pwd-input" placeholder="請輸入密碼: admin888" class="form-control" />
        <button onclick="tryLogin()" class="btn-primary" style="width:100%; margin-top:6px;">登入後台 ➔</button>
        <p id="auth-err" style="color:var(--danger); font-size:0.85rem; margin-top:10px; display:none;">密碼錯誤！請輸入 admin888</p>
      </div>
    </div>

    <!-- 獨立後台工作台 -->
    <div id="dashboard-panel" style="display:none;">
      <div class="nav-bar">
        <div>
          <h2 style="font-size:1.3rem;">⚙️ 單字挑戰王 - 完整功能管理控制台</h2>
          <span style="font-size:0.80rem; color:#10b981; font-weight:700;">🟢 管理員已登入</span>
        </div>
        <button onclick="location.reload()" class="btn-secondary" style="background:#334155; color:white;">登出</button>
      </div>

      <!-- 區塊 0：系統設定與密碼修改 -->
      <div class="section-card" style="border:2px solid #a855f7; background:#faf5ff;">
        <h3 style="color:#6b21a8;">⚙️ 系統設定與管理員密碼修改</h3>
        <div class="form-row" style="margin-bottom:0;">
          <input type="password" id="new-admin-pwd" placeholder="輸入新的管理員密碼" class="form-control" style="flex:1; margin-bottom:0;" />
          <button id="save-admin-pwd-btn" class="btn-primary" style="background:#6b21a8; white-space:nowrap;">修改後台密碼</button>
        </div>
      </div>

      <!-- 區塊 1：✍️ 手動新增單字 -->
      <div class="section-card" style="border:2px solid #4338ca; background:#f0f4ff;">
        <h3 style="color:#4338ca;">✍️ 手動新增單字</h3>
        <form id="manual-add-form">
          <div class="form-row">
            <select id="manual-category" class="form-control" style="flex:1;">
              <option value="國中">📚 國中</option>
              <option value="高中學測" selected>📖 高中學測</option>
              <option value="Level 4">🌟 Level 4</option>
            </select>
            <input type="text" id="manual-folder" placeholder="資料夾/單元 (例如: Unit 1)" class="form-control" style="flex:1;" required />
          </div>
          <div class="form-row">
            <input type="text" id="manual-word" placeholder="英文單字 (例如: approach)" class="form-control" style="flex:1;" required />
            <input type="text" id="manual-pos" placeholder="詞性 (例如: n./v.)" class="form-control" style="flex:0.6;" required />
            <input type="text" id="manual-zh" placeholder="中文釋義 (例如: 接近；方法)" class="form-control" style="flex:1.4;" required />
          </div>
          <button type="submit" class="btn-primary" style="width:100%;">➕ 手動加入題庫</button>
        </form>
      </div>

      <!-- 區塊 2：📊 Excel 檔案批次匯入題庫 -->
      <div class="section-card" style="border:2px solid #10b981; background:#f0fdf4;">
        <h3 style="color:#065f46;">📊 透過 Excel 檔案批次匯入題庫</h3>
        <div class="form-row">
          <select id="excel-category" class="form-control" style="flex:1; background:white;">
            <option value="國中">📚 國中</option>
            <option value="高中學測" selected>📖 高中學測</option>
            <option value="Level 4">🌟 Level 4</option>
          </select>
          <input type="text" id="excel-folder" placeholder="預設資料夾/單元 (若空白將自動每20字分 CH1, CH2...)" class="form-control" style="flex:1; background:white;" />
          <input type="file" id="excel-file-input" accept=".xlsx, .xls" class="form-control" style="flex:1.5; background:white;" />
        </div>
        <button id="import-excel-btn" class="btn-excel" style="width:100%; margin-top:6px;">📥 匯入 Excel 題庫</button>
      </div>

      <!-- 區塊 3：🗑️ 題目管理與分類檢視 -->
      <div class="section-card" style="border:2px solid #4338ca;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; flex-wrap:wrap; gap:8px;">
          <h3 style="margin-bottom:0; color:#4338ca;">🗑️ 題目管理與分類檢視 (<span id="total-count-text">0</span> 題)</h3>
          <button id="btn-restore-default" class="btn-secondary" style="font-size:0.8rem; padding:6px 10px;">↺ 恢復預設題庫</button>
        </div>
        <div class="form-row">
          <select id="filter-category-select" class="form-control" style="flex:1; font-weight:700;">
            <option value="全部大分類">全部大分類</option>
            <option value="國中">國中</option>
            <option value="高中學測">高中學測</option>
            <option value="Level 4">Level 4</option>
          </select>
          <select id="filter-folder-select" class="form-control" style="flex:1; font-weight:700;">
            <option value="全部資料夾">全部資料夾/單元</option>
          </select>
          <input type="text" id="search-word-input" placeholder="🔍 搜尋單字或中文..." class="form-control" style="flex:1.5; margin-bottom:0;" />
        </div>
        <div id="word-table-list" style="max-height:380px; overflow-y:auto; padding-right:4px; margin-top:10px;"></div>
      </div>

      <!-- 區塊 4：👥 學生帳號與權限設定 -->
      <div class="section-card">
        <h3>👥 學生帳號與學習權限管理</h3>
        <form id="add-student-form" class="form-row" style="flex-wrap:wrap; margin-bottom:10px;">
          <input type="text" id="stu-acc" placeholder="帳號 (例: Roger)" required style="flex:1;" class="form-control" />
          <input type="password" id="stu-pwd" placeholder="密碼 (例: 1209)" required style="flex:1;" class="form-control" />
          <input type="text" id="stu-name" placeholder="學生姓名 (例: 羅傑)" required style="flex:1;" class="form-control" />
          <select id="stu-perm" class="form-control" style="flex:1;">
            <option value="國中">📚 國中權限</option>
            <option value="高中" selected>📖 高中權限 (高中+Level 4)</option>
          </select>
          <button type="submit" class="btn-primary" style="flex:1; height:42px;">➕ 建立帳號</button>
        </form>
        <div id="student-list" style="max-height:160px; overflow-y:auto;"></div>
      </div>
    </div>
  </div>

  <script>
    const DEFAULT_BASE_QUESTIONS = [
      {"id": 1, "category": "高中學測", "folder": "Unit 1", "word": "cue", "pos": "n.", "isPhrase": false, "zh": "提示；線索", "sentence": "My teacher nodded at me, and that was my ___ to start speaking.", "options": ["cue", "finance", "prime", "rebel"]},
      {"id": 2, "category": "Level 4", "folder": "Unit 2", "word": "approach", "pos": "n./v.", "isPhrase": false, "zh": "接近；方法", "sentence": "The government decided to ___ the issue carefully.", "options": ["approach", "divorce", "disappoint", "finance"]}
    ];

    let questions = [];
    let students = [];

    function loadLocalData() {
      const savedQ = localStorage.getItem('app_all_questions');
      if (savedQ) {
        try { 
          questions = JSON.parse(savedQ); 
          questions = questions.map(q => ({
            ...q,
            category: q.category || "高中學測",
            folder: q.folder || q.chapter || "Unit 1"
          }));
        } catch(e) { questions = [...DEFAULT_BASE_QUESTIONS]; }
      } else {
        questions = [...DEFAULT_BASE_QUESTIONS];
        localStorage.setItem('app_all_questions', JSON.stringify(questions));
      }

      const savedS = localStorage.getItem('student_accounts');
      if (savedS) {
        try { 
          students = JSON.parse(savedS); 
          students = students.map(s => ({ ...s, perm: s.perm || "高中" }));
        } catch(e) { students = []; }
      } else {
        students = [{ acc: "Roger", pwd: "1209", name: "羅傑", perm: "高中" }];
        localStorage.setItem('student_accounts', JSON.stringify(students));
      }
    }

    function saveQuestions() {
      localStorage.setItem('app_all_questions', JSON.stringify(questions));
    }

    function tryLogin() {
      const pwdVal = document.getElementById('admin-pwd-input').value.trim();
      const currentAdminPwd = localStorage.getItem('app_admin_pwd') || "admin888";
      
      if (pwdVal === currentAdminPwd || pwdVal === "admin888") {
        document.getElementById('auth-panel').style.display = 'none';
        document.getElementById('dashboard-panel').style.display = 'block';
        document.getElementById('auth-err').style.display = 'none';
        
        loadLocalData();
        renderAllDashboard();
      } else {
        document.getElementById('auth-err').style.display = 'block';
      }
    }

    document.getElementById('admin-pwd-input').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') tryLogin();
    });

    document.getElementById('save-admin-pwd-btn').addEventListener('click', () => {
      const newPwd = document.getElementById('new-admin-pwd').value.trim();
      if (!newPwd) return alert("請輸入新密碼！");
      localStorage.setItem('app_admin_pwd', newPwd);
      document.getElementById('new-admin-pwd').value = '';
      alert("🔐 管理員密碼修改成功！下次登入請使用新密碼。");
    });

    function renderAllDashboard() {
      updateFilterOptions();
      renderStudents();
      renderQuestions();
    }

    // 手動新增單字
    document.getElementById('manual-add-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const category = document.getElementById('manual-category').value;
      const folder = document.getElementById('manual-folder').value.trim();
      const word = document.getElementById('manual-word').value.trim().toLowerCase();
      const pos = document.getElementById('manual-pos').value.trim();
      const zh = document.getElementById('manual-zh').value.trim();

      const allWordsPool = questions.map(q => q.word).filter(w => w !== word);
      let distractors = ["apple", "banana", "student", "computer"];
      if (allWordsPool.length >= 3) {
        const shuffled = [...allWordsPool].sort(() => 0.5 - Math.random());
        distractors = shuffled.slice(0, 3);
      }
      let options = [word, ...distractors];
      options.sort(() => Math.random() - 0.5);

      const newQ = {
        id: Date.now(),
        category: category,
        folder: folder,
        word: word,
        pos: pos,
        isPhrase: word.includes(' ') || word.includes('-'),
        zh: zh,
        sentence: `The student needs to learn the word ___ (${zh}).`,
        options: options
      };

      questions.push(newQ);
      saveQuestions();
      renderAllDashboard();

      document.getElementById('manual-word').value = '';
      document.getElementById('manual-pos').value = '';
      document.getElementById('manual-zh').value = '';
      alert(`✅ 成功手動新增單字 "${word}" 至 [${category} / ${folder}]！`);
    });

    // Excel 匯入
    document.getElementById('import-excel-btn').addEventListener('click', () => {
      const fileInput = document.getElementById('excel-file-input');
      const file = fileInput.files[0];
      if (!file) return alert("請先選擇要上傳的 Excel 檔案！");

      const category = document.getElementById('excel-category').value;
      const customFolder = document.getElementById('excel-folder').value.trim();

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const data = new Uint8Array(e.target.result);
          const workbook = XLSX.read(data, { type: 'array' });
          const firstSheetName = workbook.SheetNames[0];
          const worksheet = workbook.Sheets[firstSheetName];
          
          const rawRows = XLSX.utils.sheet_to_json(worksheet, { header: 1 });
          if (rawRows.length <= 3) return alert("Excel 檔案內容過少或格式不符！");

          const dataRows = rawRows.slice(3);
          let newCount = 0;

          dataRows.forEach((row, index) => {
            if (!row || row.length < 4) return;
            const wordVal = String(row[1] || "").trim();
            const posVal = String(row[2] || "").trim();
            const zhVal = String(row[3] || "").trim();

            if (!wordVal || wordVal === 'undefined' || wordVal === 'NaN') return;

            let assignedFolder = customFolder;
            if (!assignedFolder) {
              const chNum = Math.floor(newCount / 20) + 1;
              assignedFolder = `CH${chNum}`;
            }

            const allWordsPool = dataRows.map(r => String(r[1] || "").trim()).filter(w => w && w !== wordVal);
            let distractors = ["apple", "banana", "student", "computer"];
            if (allWordsPool.length >= 3) {
              const shuffled = [...allWordsPool].sort(() => 0.5 - Math.random());
              distractors = shuffled.slice(0, 3);
            }
            let options = [wordVal, ...distractors];
            options.sort(() => Math.random() - 0.5);

            const newQ = {
              id: Date.now() + index,
              category: category,
              folder: assignedFolder,
              word: wordVal,
              pos: posVal || "n.",
              isPhrase: wordVal.includes(' ') || wordVal.includes('-'),
              zh: zhVal,
              sentence: `The student needs to learn the word ___ (${zhVal}).`,
              options: options
            };

            questions.push(newQ);
            newCount++;
          });

          if (newCount === 0) return alert("未能成功解析任何單字。");

          saveQuestions();
          renderAllDashboard();
          fileInput.value = "";
          alert(`🎉 成功從 Excel 匯入 ${newCount} 筆題目至 [${category}]！`);
        } catch (err) {
          alert("解析 Excel 失敗: " + err.message);
        }
      };
      reader.readAsArrayBuffer(file);
    });

    window.deleteQuestionItem = function(targetId) {
      if (confirm("確定要刪除此題目嗎？")) {
        questions = questions.filter(q => String(q.id) !== String(targetId));
        saveQuestions();
        renderQuestions();
      }
    };

    document.getElementById('btn-restore-default').addEventListener('click', () => {
      if (confirm("確定重設為預設題庫？")) {
        questions = [...DEFAULT_BASE_QUESTIONS];
        saveQuestions();
        renderAllDashboard();
      }
    });

    function updateFilterOptions() {
      const catSelect = document.getElementById('filter-category-select');
      const folderSelect = document.getElementById('filter-folder-select');
      const curCat = catSelect.value;
      const curFolder = folderSelect.value;

      let availableFolders = questions;
      if (curCat && curCat !== "全部大分類") {
        availableFolders = questions.filter(q => q.category === curCat);
      }
      const folders = ["全部資料夾", ...new Set(availableFolders.map(q => q.folder || "未分類"))];
      
      folderSelect.innerHTML = folders.map(f => `<option value="${f}">${f}</option>`).join('');
      if (folders.includes(curFolder)) folderSelect.value = curFolder;
    }

    document.getElementById('filter-category-select').addEventListener('change', () => {
      updateFilterOptions();
      renderQuestions();
    });
    document.getElementById('filter-folder-select').addEventListener('change', renderQuestions);
    document.getElementById('search-word-input').addEventListener('input', renderQuestions);

    function renderQuestions() {
      const container = document.getElementById('word-table-list');
      container.innerHTML = '';
      const keyword = document.getElementById('search-word-input').value.trim().toLowerCase();
      const catFilter = document.getElementById('filter-category-select').value;
      const folderFilter = document.getElementById('filter-folder-select').value;

      let list = questions;
      if (catFilter && catFilter !== "全部大分類") list = list.filter(q => q.category === catFilter);
      if (folderFilter && folderFilter !== "全部資料夾") list = list.filter(q => (q.folder || "未分類") === folderFilter);
      if (keyword) list = list.filter(q => q.word.toLowerCase().includes(keyword) || q.zh.toLowerCase().includes(keyword));

      document.getElementById('total-count-text').innerText = questions.length;

      list.forEach(q => {
        const div = document.createElement('div');
        div.className = 'item-card';
        div.innerHTML = `
          <div>
            <span class="tag-category">${q.category || '未分類'}</span>
            <span class="tag-folder">${q.folder || '未分類'}</span>
            <span style="background:#e0e7ff; color:#4338ca; padding:3px 6px; border-radius:4px; font-size:0.75rem; margin-left:4px;">${q.pos || '詞性'}</span>
            <strong style="margin-left:6px;">${q.word}</strong>
            <span style="color:#64748b; margin-left:8px;">${q.zh}</span>
          </div>
          <button class="btn-del" onclick="deleteQuestionItem('${q.id}')">刪除</button>
        `;
        container.appendChild(div);
      });
    }

    function renderStudents() {
      const container = document.getElementById('student-list');
      container.innerHTML = '';
      students.forEach((s, idx) => {
        const d = document.createElement('div');
        d.className = 'item-card';
        d.innerHTML = `
          <div>
            <span class="tag-category">帳號: ${s.acc}</span>
            <strong style="margin-left:8px;">${s.name}</strong>
            <span class="tag-perm" style="margin-left:8px;">權限: ${s.perm || '高中'}</span>
            <small style="color:#64748b; margin-left:8px;">(密碼: ${s.pwd})</small>
          </div>
          <button class="btn-del" onclick="delStudent(${idx})">刪除</button>
        `;
        container.appendChild(d);
      });
    }

    window.delStudent = function(idx) {
      if (confirm(`確定刪除「${students[idx].name}」？`)) {
        students.splice(idx, 1);
        localStorage.setItem('student_accounts', JSON.stringify(students));
        renderStudents();
      }
    };

    document.getElementById('add-student-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const acc = document.getElementById('stu-acc').value.trim();
      const pwd = document.getElementById('stu-pwd').value.trim();
      const name = document.getElementById('stu-name').value.trim();
      const perm = document.getElementById('stu-perm').value;

      if (students.some(s => s.acc.toLowerCase() === acc.toLowerCase())) {
        return alert("此學生帳號已存在！");
      }
      students.push({ acc, pwd, name, perm });
      localStorage.setItem('student_accounts', JSON.stringify(students));
      renderStudents();
      e.target.reset();
      alert(`✅ 學生「${name}」已建立（權限：${perm}）！`);
    });
  </script>
</body>
</html>
