<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>單字挑戰王 - 雲端即時管理控制台</title>
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    :root {
      --primary: #4338ca;
      --success: #10b981;
      --danger: #ef4444;
      --border: #cbd5e1;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #0f172a; min-height: 100vh; padding: 24px 12px; display: flex; justify-content: center; }
    .admin-container { width: 100%; max-width: 900px; background: #f8fafc; border-radius: 24px; padding: 24px; box-shadow: 0 20px 40px rgba(0,0,0,0.5); }
    .nav-bar { display: flex; justify-content: space-between; align-items: center; background: #1e293b; color: white; padding: 14px 20px; border-radius: 16px; margin-bottom: 20px; }
    .section-card { background: white; border: 1.5px solid var(--border); border-radius: 16px; padding: 18px; margin-bottom: 18px; }
    .section-card h3 { font-size: 1.05rem; color: #1e293b; margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
    .btn-primary { background: var(--primary); color: white; border: none; padding: 10px 16px; border-radius: 8px; font-weight: 800; cursor: pointer; }
    .btn-excel { background: #10b981; color: white; border: none; padding: 10px 18px; border-radius: 8px; font-weight: 800; cursor: pointer; }
    .btn-secondary { background: #e2e8f0; color: #334155; border: none; padding: 10px 16px; border-radius: 8px; font-weight: 700; cursor: pointer; }
    .btn-ai { background: linear-gradient(135deg, #6366f1, #a855f7); color: white; border: none; padding: 10px 18px; border-radius: 8px; font-weight: 800; cursor: pointer; }
    .form-row { display: flex; gap: 8px; margin-bottom: 8px; }
    .form-control { width: 100%; padding: 10px; border: 1.5px solid var(--border); border-radius: 8px; outline: none; margin-bottom: 8px; font-size: 0.9rem; }
    .item-card { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 8px; background: #ffffff; }
    .btn-del { border: none; background: #fee2e2; color: #ef4444; border-radius: 6px; padding: 6px 12px; font-weight: 800; cursor: pointer; }
    .tag { background: #e0e7ff; color: #4338ca; padding: 3px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: 700; }
    .tag-pos { background: #fef3c7; color: #b45309; padding: 3px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: 700; }
    .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid #ffffff; border-radius: 50%; border-top-color: transparent; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="admin-container">
    <!-- 登入驗證遮罩 -->
    <div id="auth-panel" style="text-align:center; padding:50px 20px;">
      <div style="font-size:3.5rem; margin-bottom:10px;">🔐</div>
      <h2 style="color:#0f172a; margin-bottom:8px;">後台管理平台驗證</h2>
      <p style="color:#64748b; font-size:0.85rem; margin-bottom:20px;">請輸入管理員密碼以進入專屬管理平台</p>
      <div style="max-width:320px; margin:0 auto;">
        <input type="password" id="admin-pwd-input" placeholder="請輸入管理密碼 (預設: admin888)" class="form-control" />
        <button id="auth-login-btn" class="btn-primary" style="width:100%; margin-top:6px;">登入後台 ➔</button>
        <p id="auth-err" style="color:var(--danger); font-size:0.85rem; margin-top:10px; display:none;">密碼錯誤！</p>
      </div>
    </div>

    <!-- 獨立後台工作台 -->
    <div id="dashboard-panel" style="display:none;">
      <div class="nav-bar">
        <div>
          <h2 style="font-size:1.3rem;">⚙️ 單字挑戰王 - 雲端即時控制台</h2>
          <span id="cloud-sync-status" style="font-size:0.8rem; color:#10b981; font-weight:700;">🟢 雲端資料同步中...</span>
        </div>
        <button id="logout-btn" class="btn-secondary" style="background:#334155; color:white;">登出</button>
      </div>

      <!-- 區塊 0：✨ Gemini API Key -->
      <div class="section-card" style="border:2px solid #a855f7; background:#faf5ff;">
        <h3 style="color:#6b21a8;">✨ Google Gemini 智慧視覺辨識設定</h3>
        <div class="form-row" style="margin-bottom:0;">
          <input type="password" id="gemini-api-key" placeholder="請在此貼上 Gemini API Key" class="form-control" style="margin-bottom:0;" />
          <button id="save-api-key-btn" class="btn-ai" style="white-space:nowrap;">儲存 Key</button>
        </div>
        <div id="api-key-status" style="font-size:0.75rem; margin-top:6px; color:#15803d; font-weight:700;"></div>
      </div>

      <!-- 區塊 1：📸 拍照 AI 建題 -->
      <div class="section-card" style="border:2px dashed #6366f1;">
        <h3 style="color:#4338ca;">📸 課本照片智慧辨識（自動同步至雲端）</h3>
        <div class="form-row">
          <input type="text" id="ocr-chapter" placeholder="設定匯入章節 (如: Unit 2)" value="Unit 2" class="form-control" style="flex:1; margin-bottom:0;" />
          <input type="file" id="ocr-file" accept="image/*" class="form-control" style="flex:2; margin-bottom:0;" />
        </div>
        <div id="ocr-status" style="display:none; color:#4338ca; font-weight:800; font-size:0.9rem; margin:10px 0;"></div>
        <div id="ocr-preview-box" style="display:none; margin-top:10px;">
          <div style="font-size:0.8rem; font-weight:700; color:#334155; margin-bottom:4px;">預覽解析結果：</div>
          <textarea id="ocr-json" style="width:100%; height:160px; font-family:monospace; padding:8px; border-radius:8px; border:1.5px solid #cbd5e1; font-size:0.85rem;"></textarea>
          <div style="display:flex; gap:8px; margin-top:6px;">
            <button id="import-ocr-btn" class="btn-primary" style="background:#10b981; flex:1;">✅ 確認將題目加入雲端題庫</button>
            <button id="cancel-ocr-btn" class="btn-secondary" style="flex:0.3;">取消</button>
          </div>
        </div>
      </div>

      <!-- 區塊 2：🗑️ 題目管理 -->
      <div class="section-card" style="border:2px solid #6366f1;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; flex-wrap:wrap; gap:8px;">
          <h3 style="margin-bottom:0; color:#4338ca;">🗑️ 雲端題庫管理 (<span id="total-count-text">0</span> 題)</h3>
          <button id="btn-restore-default" class="btn-secondary" style="font-size:0.8rem; padding:6px 10px;">↺ 恢復預設題庫</button>
        </div>
        <div class="form-row">
          <input type="text" id="search-word-input" placeholder="🔍 搜尋題庫單字..." class="form-control" style="margin-bottom:10px;" />
          <select id="filter-chapter-select" class="form-control" style="flex:0.6; margin-bottom:10px; font-weight:700;">
            <option value="全部章節">全部章節</option>
          </select>
        </div>
        <div id="word-table-list" style="max-height:350px; overflow-y:auto; padding-right:4px;"></div>
      </div>

      <!-- 區塊 3：👥 學生帳密雲端管理 -->
      <div class="section-card">
        <h3>👥 學生帳號雲端同步管理</h3>
        <form id="add-student-form" class="form-row" style="flex-wrap:wrap; margin-bottom:10px;">
          <input type="text" id="stu-acc" placeholder="帳號 (例如: Roger)" required style="flex:1.2;" class="form-control" />
          <input type="password" id="stu-pwd" placeholder="密碼 (例如: 1209)" required style="flex:1.2;" class="form-control" />
          <input type="text" id="stu-name" placeholder="學生姓名 (例如: 羅傑)" required style="flex:1.2;" class="form-control" />
          <button type="submit" class="btn-primary" style="flex:1; height:42px;">➕ 建立並同步雲端</button>
        </form>
        <div id="student-list" style="max-height:160px; overflow-y:auto;"></div>
      </div>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAsIcTNN77iuoK2UuWePMZX_zf3tFhUHEw",
      authDomain: "vocab-king-1209.firebaseapp.com",
      databaseURL: "https://vocab-king-1209-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "vocab-king-1209",
      storageBucket: "vocab-king-1209.firebasestorage.app",
      messagingSenderId: "476030693466",
      appId: "1:476030693466:web:7199ea3c8a70a0b6906863"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const DEFAULT_BASE_QUESTIONS = [
      {"id": 1, "chapter": "Unit 1", "word": "cue", "pos": "n.", "isPhrase": false, "zh": "提示；線索", "sentence": "My teacher nodded at me, and that was my ___ to start speaking.", "options": ["cue", "finance", "prime", "rebel"]},
      {"id": 2, "chapter": "Unit 1", "word": "declare", "pos": "v.", "isPhrase": false, "zh": "宣布；宣稱；申報", "sentence": "The government decided to ___ the day a public holiday.", "options": ["declare", "divorce", "disappoint", "finance"]}
    ];

    let adminPwd = localStorage.getItem('app_admin_pwd') || "ning0908";
    let questions = [];
    let students = [];

    // 即時從雲端同步題庫與學生名單
    db.ref('questions').on('value', (snap) => {
      const val = snap.val();
      if (val) {
        questions = Array.isArray(val) ? val : Object.values(val);
      } else {
        questions = [...DEFAULT_BASE_QUESTIONS];
        db.ref('questions').set(questions);
      }
      renderAllDashboard();
    });

    db.ref('students').on('value', (snap) => {
      const val = snap.val();
      if (val) {
        students = Array.isArray(val) ? val : Object.values(val);
      } else {
        students = [{ acc: "Roger", pwd: "1209", name: "羅傑" }];
        db.ref('students').set(students);
      }
      renderStudents();
    });

    document.getElementById('auth-login-btn').addEventListener('click', () => {
      const input = document.getElementById('admin-pwd-input').value.trim();
      if (input === adminPwd) {
        document.getElementById('auth-panel').style.display = 'none';
        document.getElementById('dashboard-panel').style.display = 'block';
        document.getElementById('auth-err').style.display = 'none';
        checkApiKeyStatus();
      } else {
        document.getElementById('auth-err').style.display = 'block';
      }
    });

    document.getElementById('admin-pwd-input').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') document.getElementById('auth-login-btn').click();
    });

    document.getElementById('logout-btn').addEventListener('click', () => {
      document.getElementById('dashboard-panel').style.display = 'none';
      document.getElementById('auth-panel').style.display = 'block';
      document.getElementById('admin-pwd-input').value = '';
    });

    function renderAllDashboard() {
      updateChapterOptions();
      renderQuestions();
    }

    function checkApiKeyStatus() {
      const key = localStorage.getItem('gemini_api_key') || '';
      const statusEl = document.getElementById('api-key-status');
      const inputEl = document.getElementById('gemini-api-key');
      if (key) {
        inputEl.value = key;
        statusEl.innerText = "✅ 已配置 Gemini API Key，已啟動 AI 視覺辨識功能！";
      } else {
        statusEl.innerText = "⚠️ 未設定 API Key";
      }
    }

    document.getElementById('save-api-key-btn').addEventListener('click', () => {
      const val = document.getElementById('gemini-api-key').value.trim();
      if (val) {
        localStorage.setItem('gemini_api_key', val);
        alert("🎉 Gemini API Key 儲存成功！");
      }
      checkApiKeyStatus();
    });

    // AI 辨識
    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve({ base64Data: reader.result.split(',')[1], mimeType: file.type });
        reader.onerror = error => reject(error);
      });
    }

    async function recognizeWithGemini(file, chapterName, apiKey) {
      const { base64Data, mimeType } = await fileToBase64(file);
      const prompt = `請分析這張英文課本/講義照片，提取所有單字或片語。請嚴格輸出 JSON 陣列，不要加入任何 markdown 標籤：
[
  {
    "id": 123456789,
    "chapter": "${chapterName}",
    "word": "單字全小寫",
    "pos": "詞性 (n., v., adj., phr.)",
    "isPhrase": false,
    "zh": "中文釋義",
    "sentence": "例句，必須將該單字替換成 ___",
    "options": ["正確單字", "干擾項1", "干擾項2", "干擾項3"]
  }
]`;
      const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash:generateContent?key=${apiKey}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ contents: [{ parts: [{ text: prompt }, { inlineData: { mimeType: mimeType || "image/jpeg", data: base64Data } }] }] })
      });
      const result = await response.json();
      const rawText = result.candidates[0].content.parts[0].text.trim();
      return JSON.parse(rawText.replace(/```json/gi, '').replace(/
