<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>高中單字挑戰王 - 完整雲端後台</title>
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <!-- Tesseract.js (圖片辨識) -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
  <style>
    :root {
      --primary: #4338ca;
      --border: #e2e8f0;
      --danger: #ef4444;
      --success: #10b981;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #0f172a; min-height: 100vh; display: flex; justify-content: center; align-items: flex-start; padding: 20px 14px; }
    .admin-shell { width: 100%; max-width: 860px; background: #ffffff; border-radius: 20px; overflow: hidden; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.8); display: flex; flex-direction: column; margin-bottom: 40px; }
    .header-bar { background: #1e293b; color: #fff; padding: 18px 24px; display: flex; justify-content: space-between; align-items: center; }
    .main-body { padding: 24px; display: flex; flex-direction: column; gap: 22px; }
    .admin-input-full { width: 100%; padding: 11px 14px; border: 1.5px solid var(--border); border-radius: 10px; margin-bottom: 10px; font-size: 0.95rem; outline: none; }
    .admin-input-full:focus { border-color: var(--primary); }
    .btn-primary { padding: 12px 18px; background: var(--primary); color: white; border: none; border-radius: 10px; font-size: 1rem; font-weight: 700; cursor: pointer; }
    .btn-secondary { padding: 11px 16px; background: #0284c7; color: white; border: none; border-radius: 10px; font-size: 0.95rem; font-weight: 700; cursor: pointer; }
    .btn-danger-outline { border: 1.5px solid var(--danger); background: transparent; color: var(--danger); padding: 5px 10px; border-radius: 6px; font-weight: 700; cursor: pointer; }
    .grid-form { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .card-box { background: #f8fafc; border: 1px solid var(--border); border-radius: 14px; padding: 18px; }
    .table-container { max-height: 280px; overflow-y: auto; border: 1px solid var(--border); border-radius: 10px; margin-top: 12px; }
    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.9rem; }
    th, td { padding: 12px; border-bottom: 1px solid var(--border); }
    th { background: #f1f5f9; position: sticky; top: 0; z-index: 1; }
    .status-tag { display: inline-block; padding: 4px 10px; border-radius: 6px; font-size: 0.8rem; font-weight: 700; background: #dcfce7; color: #166534; }
  </style>
</head>
<body>
  <div class="admin-shell">
    <div class="header-bar">
      <h2>⚙️ 高中單字挑戰王 - 雲端管理中心</h2>
      <span id="sync-status" class="status-tag">連線中...</span>
    </div>

    <!-- 登入介面 -->
    <div id="login-view" class="main-body" style="justify-content: center; align-items: center; min-height: 380px;">
      <div style="max-width: 320px; width: 100%; text-align: center;">
        <h3 style="margin-bottom: 16px;">後台管理員驗證</h3>
        <input type="password" id="admin-pwd" placeholder="管理員密碼 (預設 admin888)" class="admin-input-full" />
        <button id="admin-login-btn" class="btn-primary" style="width: 100%;">登入後台</button>
      </div>
    </div>

    <!-- 管理功能面板 -->
    <div id="dashboard-view" class="main-body" style="display: none;">
      
      <!-- 1. 學生帳號密碼管理 -->
      <div class="card-box">
        <h3 style="margin-bottom: 12px;">👥 學生帳號管理（自動同步所有裝置）</h3>
        <div class="grid-form">
          <input type="text" id="new-stu-acc" placeholder="學生帳號 (例如: Roger)" class="admin-input-full" />
          <input type="text" id="new-stu-name" placeholder="學生姓名 (例如: 羅傑)" class="admin-input-full" />
        </div>
        <div class="grid-form">
          <input type="text" id="new-stu-pwd" placeholder="登入密碼 (例如: 1209)" class="admin-input-full" />
          <button id="add-student-btn" class="btn-primary">＋ 新增學生帳號</button>
        </div>
        <div class="table-container" style="max-height: 160px;">
          <table>
            <thead><tr><th>帳號</th><th>姓名</th><th>密碼</th><th>操作</th></tr></thead>
            <tbody id="student-tbody"></tbody>
          </table>
        </div>
      </div>

      <!-- 2. 圖片 OCR 辨識匯入 -->
      <div class="card-box">
        <h3 style="margin-bottom: 8px;">📷 圖片拍照 / OCR 智慧辨識匯入</h3>
        <p style="font-size: 0.85rem; color: #64748b; margin-bottom: 12px;">可直接上傳講義或課本單字照片，系統自動辨識並填入下方文字區。</p>
        <div class="grid-form" style="margin-bottom: 10px;">
          <input type="text" id="ocr-chapter" placeholder="指派章節 (預設: Unit 1)" class="admin-input-full" value="Unit 1" />
          <input type="file" id="ocr-file-input" accept="image/*" class="admin-input-full" />
        </div>
        <button id="start-ocr-btn" class="btn-secondary" style="width: 100%;">🔍 開始圖片文字辨識</button>
        <div id="ocr-status" style="font-size: 0.88rem; color: #4338ca; font-weight: 700; margin-top: 8px; display: none;"></div>
      </div>

      <!-- 3. 批次文字貼上匯入 -->
      <div class="card-box">
        <h3 style="margin-bottom: 8px;">📋 批次文字匯入</h3>
        <p style="font-size: 0.85rem; color: #64748b; margin-bottom: 10px;">格式：<code>單字 詞性 中文 [例句選填]</code>（每行一筆，可用空格或 Tab 隔開）</p>
        <textarea id="batch-input" rows="5" class="admin-input-full" style="resize: vertical;" placeholder="cue n. 提示；線索 My teacher nodded at me, and that was my ___ to start speaking.&#10;declare v. 宣布 The government decided to ___ the day a public holiday."></textarea>
        <button id="batch-import-btn" class="btn-primary" style="width: 100%;">📥 批次寫入雲端題庫</button>
      </div>

      <!-- 4. 單題新增與現有題庫列表 -->
      <div class="card-box">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
          <h3>📚 單題手動新增</h3>
          <button id="reset-default-btn" class="btn-danger-outline" style="border-style: dashed;">恢復出廠 25 題至雲端</button>
        </div>
        <div class="grid-form">
          <input type="text" id="q-chapter" placeholder="章節 (例如: Unit 1)" class="admin-input-full" value="Unit 1" />
          <input type="text" id="q-word" placeholder="英文單字 / 片語" class="admin-input-full" />
        </div>
        <div class="grid-form">
          <select id="q-pos" class="admin-input-full">
            <option value="n.">名詞 (n.)</option>
            <option value="v.">動詞 (v.)</option>
            <option value="adj.">形容詞 (adj.)</option>
            <option value="adv.">副詞 (adv.)</option>
            <option value="phr.">片語 (phr.)</option>
          </select>
          <input type="text" id="q-zh" placeholder="中文釋義" class="admin-input-full" />
        </div>
        <input type="text" id="q-sentence" placeholder="例句（空格請用 ___ 表示，選填）" class="admin-input-full" />
        <button id="add-q-btn" class="btn-primary" style="width: 100%;">＋ 新增此題目至雲端</button>

        <h4 style="margin-top: 20px; margin-bottom: 8px;">現有題庫清單 (<span id="q-count-tag">0</span> 題)</h4>
        <div class="table-container">
          <table>
            <thead><tr><th>章節</th><th>單字/片語</th><th>詞性</th><th>中文釋義</th><th>操作</th></tr></thead>
            <tbody id="questions-tbody"></tbody>
          </table>
        </div>
      </div>

    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAsIcTNN77iuoK2UuWePMZX_zf3tFhUHEw",
      authDomain: "vocab-king-1209.firebaseapp.com",
      databaseURL: "https://vocab-king-1209-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "vocab-king-1209",
      storageBucket: "vocab-king-1209.firebasestorage.app",
      messagingSenderId: "476030693466",
      appId: "1:476030693466:web:7199ea3c8a70a0b6906863"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const DEFAULT_BASE_QUESTIONS = [
      {"id": 1, "chapter": "Unit 1", "word": "cue", "pos": "n.", "isPhrase": false, "zh": "提示；線索", "sentence": "My teacher nodded at me, and that was my ___ to start speaking.", "options": ["cue", "finance", "prime", "rebel"]},
      {"id": 2, "chapter": "Unit 1", "word": "declare", "pos": "v.", "isPhrase": false, "zh": "宣布；宣稱；申報", "sentence": "The government decided to ___ the day a public holiday.", "options": ["declare", "divorce", "disappoint", "finance"]},
      {"id": 3, "chapter": "Unit 1", "word": "declaration", "pos": "n.", "isPhrase": false, "zh": "宣告；聲明；申報", "sentence": "The man made a formal ___ that he had nothing to do with the robbery.", "options": ["declaration", "percentage", "rebellion", "insurance"]},
      {"id": 4, "chapter": "Unit 1", "word": "disappoint", "pos": "v.", "isPhrase": false, "zh": "使失望；使沮喪", "sentence": "I didn't want to ___ Lydia, so I went to her party even though I felt ill.", "options": ["disappoint", "declare", "insure", "finance"]},
      {"id": 5, "chapter": "Unit 1", "word": "disappointment", "pos": "n.", "isPhrase": false, "zh": "失望；掃興", "sentence": "You can see the ___ in her eyes as she heard the bad news.", "options": ["disappointment", "rebellion", "percentage", "declaration"]},
      {"id": 6, "chapter": "Unit 1", "word": "divorce", "pos": "v.", "isPhrase": false, "zh": "離婚；使分離", "sentence": "Fredrick's parents decided to ___ five years ago.", "options": ["divorce", "declare", "insure", "reject"]},
      {"id": 7, "chapter": "Unit 1", "word": "finance", "pos": "v./n.", "isPhrase": false, "zh": "資助；提供資金 / 財務；金融", "sentence": "Several experts in ___ predicted the collapse of the housing market.", "options": ["finance", "insurance", "intellect", "rebellion"]},
      {"id": 8, "chapter": "Unit 1", "word": "financial", "pos": "adj.", "isPhrase": false, "zh": "財務的；金融的", "sentence": "Fred is having ___ problems right now, so don't ask him for money.", "options": ["financial", "rebellious", "divorced", "intellectual"]},
      {"id": 9, "chapter": "Unit 1", "word": "insurance", "pos": "n.", "isPhrase": false, "zh": "保險；保險業", "sentence": "Doug's ___ will pay for some of the repairs to his car.", "options": ["insurance", "declaration", "rejection", "finance"]},
      {"id": 10, "chapter": "Unit 1", "word": "insure", "pos": "v.", "isPhrase": false, "zh": "為……投保", "sentence": "It is important to ___ your valuable jewelry against theft.", "options": ["insure", "divorce", "disappoint", "declare"]},
      {"id": 11, "chapter": "Unit 1", "word": "intellectual", "pos": "adj./n.", "isPhrase": false, "zh": "智力的；智能的 / 知識分子", "sentence": "This is an ___ game that challenges players' critical thinking.", "options": ["intellectual", "financial", "rebellious", "divorced"]},
      {"id": 12, "chapter": "Unit 1", "word": "intellect", "pos": "n.", "isPhrase": false, "zh": "思維能力；理解力；智力", "sentence": "A person of great ___ can easily analyze complex social problems.", "options": ["intellect", "insurance", "rebellion", "percentage"]},
      {"id": 13, "chapter": "Unit 1", "word": "percent", "pos": "n.", "isPhrase": false, "zh": "百分之……", "sentence": "About twenty ___ of the world's population lives in China.", "options": ["percent", "rebel", "cue", "prime"]},
      {"id": 14, "chapter": "Unit 1", "word": "percentage", "pos": "n.", "isPhrase": false, "zh": "百分比；比率", "sentence": "He spends a large ___ of his income on apartment rent.", "options": ["percentage", "insurance", "rebellion", "declaration"]},
      {"id": 15, "chapter": "Unit 1", "word": "prime", "pos": "adj.", "isPhrase": false, "zh": "首要的；最具代表性的", "sentence": "Our ___ concern is making sure that our customers are happy.", "options": ["prime", "intellectual", "rebellious", "financial"]},
      {"id": 16, "chapter": "Unit 1", "word": "rebel", "pos": "v./n.", "isPhrase": false, "zh": "反抗；造反 / 反抗者", "sentence": "Teenagers sometimes ___ against their parents.", "options": ["rebel", "insure", "finance", "declare"]},
      {"id": 17, "chapter": "Unit 1", "word": "rebellion", "pos": "n.", "isPhrase": false, "zh": "反叛；叛亂", "sentence": "The army suppressed the armed ___ in the northern province.", "options": ["rebellion", "percentage", "declaration", "disappointment"]},
      {"id": 18, "chapter": "Unit 1", "word": "rebellious", "pos": "adj.", "isPhrase": false, "zh": "叛逆的", "sentence": "She has a ___ attitude toward outdated social rules.", "options": ["rebellious", "intellectual", "financial", "intelligent"]},
      {"id": 19, "chapter": "Unit 1", "word": "rejection", "pos": "n.", "isPhrase": false, "zh": "拒絕", "sentence": "Although I was hopeful, I received a letter of ___ for my application.", "options": ["rejection", "insurance", "declaration", "percentage"]},
      {"id": 20, "chapter": "Unit 1", "word": "reject", "pos": "v.", "isPhrase": false, "zh": "拒絕；不接受", "sentence": "The committee decided to ___ the proposal due to lack of merit.", "options": ["reject", "divorce", "declare", "finance"]},
      {"id": 101, "chapter": "Unit 1", "word": "on cue", "pos": "phr.", "isPhrase": true, "zh": "恰好在此時；正當那時", "sentence": "We were talking about earthquakes and then an earthquake happened right ___.", "options": ["on cue", "in prime", "with percent", "for finance"]},
      {"id": 102, "chapter": "Unit 1", "word": "take your cue from", "pos": "phr.", "isPhrase": true, "zh": "照某人的樣子做；仿效某人", "sentence": "___ your older sister and finish your homework now.", "options": ["Take your cue from", "Declare war on", "Rebel against", "Insure with"]},
      {"id": 103, "chapter": "Unit 1", "word": "declare war", "pos": "phr.", "isPhrase": true, "zh": "宣戰", "sentence": "The government refused to ___ despite severe border tensions.", "options": ["declare war", "take cue", "in prime", "be 100 percent"]},
      {"id": 104, "chapter": "Unit 1", "word": "to one's disappointment", "pos": "phr.", "isPhrase": true, "zh": "讓某人失望的是……", "sentence": "___, the girl he likes didn't show up at the party.", "options": ["To his disappointment", "In his prime", "On his cue", "With his finance"]},
      {"id": 105, "chapter": "Unit 1", "word": "corporate finance", "pos": "phr.", "isPhrase": true, "zh": "企業財務", "sentence": "She specialized in ___ and helps companies manage capital.", "options": ["corporate finance", "health insurance", "prime time", "intellectual property"]}
    ];

    let currentQuestions = [];
    let currentStudents = [];

    // 監聽雲端連線狀態
    db.ref('.info/connected').on('value', (snap) => {
      const el = document.getElementById('sync-status');
      if (snap.val() === true) {
        el.innerText = '雲端已同步 🟢';
        el.style.background = '#dcfce7';
        el.style.color = '#166534';
      } else {
        el.innerText = '連線中...';
        el.style.background = '#fee2e2';
        el.style.color = '#991b1b';
      }
    });

    document.getElementById('admin-login-btn').addEventListener('click', () => {
      const pwd = document.getElementById('admin-pwd').value;
      if (pwd === 'admin888') {
        document.getElementById('login-view').style.display = 'none';
        document.getElementById('dashboard-view').style.display = 'flex';
        initRealtimeSync();
      } else {
        alert('密碼錯誤！預設為 admin888');
      }
    });

    function initRealtimeSync() {
      // 學生同步
      db.ref('students').on('value', (snap) => {
        const val = snap.val();
        if (!val) {
          const initList = [
            { acc: "Roger", pwd: "1209", name: "Roger" },
            { acc: "student1", pwd: "1234", name: "示範生小明" }
          ];
          db.ref('students').set(initList);
          return;
        }
        currentStudents = Array.isArray(val) ? val : Object.values(val);
        renderStudents();
      });

      // 題庫同步
      db.ref('questions').on('value', (snap) => {
        const val = snap.val();
        if (!val) {
          db.ref('questions').set(DEFAULT_BASE_QUESTIONS);
          return;
        }
        currentQuestions = Array.isArray(val) ? val : Object.values(val);
        renderQuestions();
      });
    }

    function renderStudents() {
      const tbody = document.getElementById('student-tbody');
      tbody.innerHTML = '';
      currentStudents.forEach((s, idx) => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><b>${s.acc}</b></td>
          <td>${s.name}</td>
          <td>${s.pwd}</td>
          <td><button class="btn-danger-outline" onclick="deleteStudent(${idx})">刪除</button></td>
        `;
        tbody.appendChild(tr);
      });
    }

    function renderQuestions() {
      const tbody = document.getElementById('questions-tbody');
      tbody.innerHTML = '';
      document.getElementById('q-count-tag').innerText = currentQuestions.length;
      currentQuestions.forEach((q, idx) => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${q.chapter || 'Unit 1'}</td>
          <td><b>${q.word}</b></td>
          <td>${q.pos}</td>
          <td>${q.zh}</td>
          <td><button class="btn-danger-outline" onclick="deleteQuestion(${idx})">刪除</button></td>
        `;
        tbody.appendChild(tr);
      });
    }

    // 新增學生
    document.getElementById('add-student-btn').addEventListener('click', () => {
      const acc = document.getElementById('new-stu-acc').value.trim();
      const name = document.getElementById('new-stu-name').value.trim();
      const pwd = document.getElementById('new-stu-pwd').value.trim();

      if (!acc || !name || !pwd) {
        alert('請完整填寫學生帳號、姓名與密碼！');
        return;
      }
      if (currentStudents.some(s => s.acc.toLowerCase() === acc.toLowerCase())) {
        alert('此學生帳號已存在！');
        return;
      }

      const updated = [...currentStudents, { acc, name, pwd }];
      db.ref('students').set(updated).then(() => {
        document.getElementById('new-stu-acc').value = '';
        document.getElementById('new-stu-name').value = '';
        document.getElementById('new-stu-pwd').value = '';
        alert('學生帳號已成功儲存至雲端！');
      });
    });

    window.deleteStudent = function(idx) {
      if (confirm('確定要刪除此學生帳號？')) {
        currentStudents.splice(idx, 1);
        db.ref('students').set(currentStudents);
      }
    };

    // 單題手動新增
    document.getElementById('add-q-btn').addEventListener('click', () => {
      const chapter = document.getElementById('q-chapter').value.trim() || 'Unit 1';
      const word = document.getElementById('q-word').value.trim();
      const pos = document.getElementById('q-pos').value;
      const zh = document.getElementById('q-zh').value.trim();
      const sentence = document.getElementById('q-sentence').value.trim() || `Remember the term: ___ (${zh})`;

      if (!word || !zh) {
        alert('英文單字與中文釋義為必填！');
        return;
      }

      const newQ = {
        id: Date.now(),
        chapter,
        word,
        pos,
        zh,
        isPhrase: pos === 'phr.' || word.includes(' '),
        sentence: sentence.includes('___') ? sentence : `${sentence} ___`,
        options: [word, "option_a", "option_b", "option_c"]
      };

      const updated = [...currentQuestions, newQ];
      db.ref('questions').set(updated).then(() => {
        document.getElementById('q-word').value = '';
        document.getElementById('q-zh').value = '';
        document.getElementById('q-sentence').value = '';
        alert('單題已成功儲存並同步至雲端！');
      });
    });

    window.deleteQuestion = function(idx) {
      if (confirm('確定刪除此題目？')) {
        currentQuestions.splice(idx, 1);
        db.ref('questions').set(currentQuestions);
      }
    };

    // 批次匯入
    document.getElementById('batch-import-btn').addEventListener('click', () => {
      const text = document.getElementById('batch-input').value.trim();
      if (!text) {
        alert('請先輸入批次內容！');
        return;
      }

      const lines = text.split('\n');
      const newItems = [];

      lines.forEach((line, index) => {
        const trimmed = line.trim();
        if (!trimmed) return;
        const parts = trimmed.split(/[\s,]+/);
        if (parts.length >= 3) {
          const word = parts[0];
          const pos = parts[1];
          const zh = parts[2];
          const sentence = parts.slice(3).join(' ') || `Remember: ___ (${zh})`;
          newItems.push({
            id: Date.now() + index,
            chapter: 'Unit 1',
            word,
            pos,
            zh,
            isPhrase: pos === 'phr.' || word.includes(' '),
            sentence: sentence.includes('___') ? sentence : `${sentence} ___`,
            options: [word, "opt_a", "opt_b", "opt_c"]
          });
        }
      });

      if (newItems.length === 0) {
        alert('格式不符，請確認每行具備：單字 詞性 中文');
        return;
      }

      const updated = [...currentQuestions, ...newItems];
      db.ref('questions').set(updated).then(() => {
        document.getElementById('batch-input').value = '';
        alert(`成功將 ${newItems.length} 筆資料同步至雲端題庫！`);
      });
    });

    // 圖片 OCR 辨識
    document.getElementById('start-ocr-btn').addEventListener('click', async () => {
      const fileInput = document.getElementById('ocr-file-input');
      const statusEl = document.getElementById('ocr-status');

      if (!fileInput.files || fileInput.files.length === 0) {
        alert('請先選取圖片檔案！');
        return;
      }

      const file = fileInput.files[0];
      statusEl.style.display = 'block';
      statusEl.innerText = '正在使用 AI 辨識圖片文字，請稍候...';

      try {
        const result = await Tesseract.recognize(file, 'eng+chi_tra', {
          logger: m => {
            if (m.status === 'recognizing text') {
              statusEl.innerText = `辨識中：${Math.round(m.progress * 100)}%`;
            }
          }
        });

        statusEl.innerText = '辨識完成！已填入批次文字區，請檢查後按「批次寫入雲端題庫」。';
        document.getElementById('batch-input').value = result.data.text;
      } catch (err) {
        statusEl.innerText = '辨識發生錯誤：' + err.message;
      }
    });

    // 恢復 25 題
    document.getElementById('reset-default-btn').addEventListener('click', () => {
      if (confirm('確定要將雲端題庫恢復為出廠的 25 題嗎？')) {
        db.ref('questions').set(DEFAULT_BASE_QUESTIONS).then(() => {
          alert('已恢復出廠 25 題！');
        });
      }
    });
  </script>
</body>
</html>
